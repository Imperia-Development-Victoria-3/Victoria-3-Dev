 # JOURNAL ENTRIES
 
 je_kurd_pacification: "The Question of Kurdistan"
 je_kurd_pacification_goal: "Either side must reach 12 points to succeed."

 je_kurd_pacification_reason: "The Kurdish Emirates, once autonomous under Ottoman rule, have lost their independence as of two years ago.\nThe Ottomans, in decline, seek to integrate the Kurds, while Emirs like [SCOPE.gsInterestGroup('landowners_ig').GetLeader.GetFullName] resist, fighting for sovereignty. Ottoman Governor [SCOPE.gsInterestGroup('armed_forces_ig').GetLeader.GetFullName] struggles to maintain control, leading to ongoing turmoil.\nBoth sides compete for dominance—one seeking stability through integration, the other striving for freedom. Progress toward either outcome is shaped by Kurdish and external influences, particularly the Ottomans, with each event shifting the balance toward a decisive future for the Kurdish people."

