l_english:
 ottoman_primer_event.1.t: "The Eternal State"
 ottoman_primer_event.1.d: "For a long time, the Ottomans were the terror of Europe. Within a very short time, the Empire expanded from a small Anatolian state to a world power. Its defining and unifying values were clear; for it was bravery and Islam that held the empire together for centuries. Since 1570, the Ottoman Sultan has been recognized as the Caliph of Islam and thus the protector and representative of the Islamic world. Admired by fellow Muslims and hated by the West, the Ottoman Empire moves into the new age a shadow of its former self. When Fatih Sultan Mehmet conquered Constantinople, he assured his new subjects that they would not be forced into the faith and culture of the Turks, and would receive his protection universally. This is still true today; the Empire offers all its subjects freedoms that few others grant, but freedom does not necessarily mean that they have a voice."
 ottoman_primer_event.1.f: " “Those of us who kill will be ghazis; those of us who die will be martyrs.” \n-Murad II"
 ottoman_primer_event.1.a: " Tell me more"
 ottoman_primer_event.2.a: " Lets get started..."
 
 ottoman_primer_event.2.t: "The Eternal State Continued"
 ottoman_primer_event.2.d: "Dark clouds are gathering. The Eternal State; the glorious Ottoman Empire, seems to be receding. Nationalism spreads like a plague, waiting to be unleashed into the rest of the Balkans. Minorities demand freedom and total independence; and some like the Greeks have even achieved it. Our economic and military capabilities are lagging behind, as the Janissaries have made reforms impossible in the past. However, with the convenient removal of the Jannisary Corps in the Auspicious Incident but a few years prior, we are presented with the once-in-a-generation opportunity to bring the Empire back from the brink, in the name of Allah!"
 ottoman_primer_event.2.f: " “No one will reap except what they sow.” \n-Quran 6:164"
 
 ottoman_primer_event.3.t: "The Eternal State Continued"
 ottoman_primer_event.3.d: "It is no secret that our influence is declining. The Europeans despise us. Even as they profess friendship, they plot the partition of our lands behind our backs. In a moment of weakness, Egypt has been allowed to occupy the entirety of Syria, with Muhammad Ali Pasha ruling it as his own realm. We must take back what was taken away from us, but the Empire remains unstable and requires far-reaching reorganization and reform. The Balkans must be deterred from rebelling, the military reformed, the eyalets reorganized and diplomatic relations renewed. Hard times are coming for the Eternal State. How far will our enemies go to weaken us? But above all, how far will we go to maintain the Empire?"
 ottoman_primer_event.3.f: "Width of life is more important than length of life. \n-Avicenna"
 
 iranian_primer_event.1.t: "Qajar Iran"
 iranian_primer_event.1.d: "The Qajars have ruled Iran for the last forty years, founded by the success of Agha Mohammad Khan in a civil war that saw a new dynasty be born. He was a man who sought to reclaim the old borders of Iran, leading numerous campaigns into the Caucasus and Central Asia. He achieved many successes and greatly expanded the Qajar Empire, until his unfortunate assassination. His heirs have since struggled with the Russians and Ottomans alike, who have clawed at our the borders and inflicted defeat after defeat on our armies."
 iranian_primer_event.1.f: "The world is a game of chess; the loser loses and the winner wins. \n-Jamal-al-Din Afghani"
 iranian_primer_event.1.a: "Tell me more"
 iranian_primer_event.2.a: "Lets get started"
 
 iranian_primer_event.2.t: "The Past"
 iranian_primer_event.2.d: "Iran is home to one of the oldest Empires in the world, for our history is one of power and conquest. Cyrus the Great forged the great Achaemenid Empire, the first of many, proving that our people were not born simply to exist in mediocrity. History has been harsh, however, and though many more empires followed like the Parthians, Sassanids, and Safavids, we have slowly lost our glory. The Sassanids fell to those who carried the banner of Allah, succeeding where the Romans had failed for centuries. Yet from them our people came to know the holy word, finding peace in the one true God. The heights of our people were in this era, yet as the Mongols invaded and put our cities to the torch we receded once more. The great shah Ismail I founded the Safavids who ruled truly as an Iranian Empire once more and made the Shi'a branch of Islam the state religion."
 iranian_primer_event.2.f: "Even if the skies were shorter than my knees, I would not kneel \n-Cyrus The Great"
 
 iranian_primer_event.3.t: "Recent History"
 iranian_primer_event.3.d: "With the wars of succession over after the death of Fath-Ali Shah Qajar, the great Mohammad Shah Qajar now rules in Tehran. He is a man who has been born of war and strife, named Gazi for his defiant efforts to resist the ambitions of the Russians. It shall be him who reclaims for us  the honor and glory that should be ours by right, or he who leads us to ruin as thralls of the west or slaves of the north. The last of his rebellious kin have been captured or defeated, and although there is peace, it is hard to tell. Our cities are in ruin, the north a wasteland from the wars with our enemies and even Khorasan is beset by rebels seeking independence. His incorporation of the British military advisors is dangerous but at least our army is no longer a collection of Iranian tribesmen, but a modern military force to rival even the Ottomans. In the coming months and years, we will see if he is the man to bring us deliverance."
 iranian_primer_event.3.f: "Happy are those who find fault with themselves instead of finding fault with others \n-Muhammad"
 
 iranian_primer_event.4.t: "The Bear In The North"
 iranian_primer_event.4.d: "The Russians have taken land from us steadily over the last 30 years as our alliances with the West resulted in nothing but betrayal. When the French Empire under Napoleon chose to work with the bBear instead of us, the Russians waged war after war and annexed the Caucasus, taking land that is our right! Their merchants act with impunity in our land and refuse to pay back their massive debt to the state and moneylenders. If we do not find strong allies our sovereignty will not last for long for as soon as central Asia falls to their influence we are undoubtedly next. Russia has declared its desire to get a port in the Indian Ocean and Persian Gulf. The British are the obvious choice for a friend as they already have troops and diplomats in our capital, but they are known for their pragmatic approach to diplomacy and lack of loyalty."
 iranian_primer_event.4.f: "He, who has only one enemy, meets him everywhere \n-Iranian Proverb"
 
 spain_primer_event.1.t: "The Lions Of Christ"
 spain_primer_event.1.d: "From the Reconquista against the Muslim invaders to the grand conquest of the Americas. We as Spaniards have never shirked from our duty to enlighten the world in the name of Christ, progress, and civilization. We drove the Muslim invaders out of Iberia, bringing our people safety from centuries of brutal war. Since then we have brought the light of Christ to the New World, uplifting millions from savagery. Yet as we secured the untamed wilderness of the new world our civilizing efforts were cut short by the revolutions in France and the betrayal of our French allies in 1808. After years of bloody warfare we drove the invaders out and our beloved Spain was free once more! However our victory cost us nearly everything."
 spain_primer_event.1.f: "Who is the enemy of your happiness? Napoleon, Emperor of the French. What is Napoleon’s origin? From Evil. \n-Spanish Pamphlet"
 spain_primer_event.1.a: "Tell me more"
 spain_primer_event.2.a: "Lets get started"
 
 spain_primer_event.2.t: "The Shadow of Empire"
 spain_primer_event.2.d: "The city of Madrid; once the seat of an empire stretching from Patagonia to California. The empire that brought Civilization and Christ to two savage and dangerous continents was sent to the grave only a few decades ago and what remains is nothing more than a Kingdom plagued by the ravages of war and civil strife. Our holy mission lies unfulfilled and in our weakened state, it is unlikely we can try to take back what we lost. As old powers fall, new powers emerge, cementing their hold on the new European order and sizing up what little remains of our once glorious Empire."
 spain_primer_event.2.f: "I would rather lose all my lands and a hundred lives than be king over heretics. \n-King Philip II of Spain"
 
 spain_primer_event.3.t: "Uprising At Home"
 spain_primer_event.3.d: "In 1830 King Ferdinand VII altered the laws of succession to allow women to inherit the throne, with his wife Maria Christina giving birth to a girl named Isabella only a few months later. This change in succession rights angered the brother of Ferdinand, Don Carlos, who saw himself as the true king of a “traditional monarchy”. Supporters of his claim started an uprising against the Madrid Liberals which supported the regency of the three-year old Queen Isabella. The Carlists, as the supporters of Don Carlos saw themselves, sought to repeal the progressive features of the Spanish Constitution of 1812, which entrenched the concepts of constitutionalism, parliamentarianism, and the separation of powers in Spain."
 spain_primer_event.3.f: "The wounds received in battle bestow honor, they do not take it away. \n-Alonso Quijano"
 
 spain_primer_event.4.t: "Spain At A Crossroads"
 spain_primer_event.4.d: "Spain in recent decades has seen much hardship. The people of Spain are disillusioned with the status quo and wish for stability once more. The questions remains as to which vision of Spain will ultimately succeed? Would the regency of Queen Isabella continue, bringing with it a new era of constitutionalism that will treat the commonfolk with a fair hand? Or would Carlos' vision be triumphant, and return Spain to an era of absolutism and imperial revanchism? Will Spain rise once more and return to greatness? Or will Spain be relegated to the ranks of the middle powers, it's old empire forever a lost dream?"
 spain_primer_event.4.f: "None get to God but through trouble \n-Catherine of Aragon"
 
 france_primer_event.1.t: "Heirs Of Napoleon"
 france_primer_event.1.d: "After the exile of Napoleon, the French Monarchy was restored by the House of Bourbon who instituted a conservative government intended to restore the proprieties, if not all the institutions, of the Ancien Régime. The exiled supporters of the monarchy returned to France but despite their effort were unable to reverse most of the changes made by the French Revolution. Exhausted by decades of war, the nation experienced a period of internal and external peace, stable economic prosperity and the preliminaries of industrialisation, led by Louis XVIII. But this period of prosperity was not long lived. The government of the Bourbon Restoration was a constitutional monarchy, unlike the Ancien Régime, which was absolutist in it's ideology. This caused the power of the Royal family and Louis XVIII to reduce substantially. To combat their decline of power he decided to disband the parliament, giving rise to the popularity of the Liberal Doctrinaires. Louis had no children, so upon his death the crown passed to his brother, Charles X. This would only further legitimise the Monarchy."
 france_primer_event.1.f: "You must not fight too often with one enemy, or you will teach him all your art of war - Napoleon"
 france_primer_event.1.a: "Tell me more"
 france_primer_event.2.a: "Lets get started"
 
 france_primer_event.2.t: "The Bourbon Restoration"
 france_primer_event.2.d: "His reign of almost six years proved to be deeply unpopular amongst the liberals in France from the moment of his coronation in 1825, in which he tried to revive the practice of the royal touch. The governments appointed under his reign reimbursed former landowners for the abolition of feudalism at the expense of bondholders, increased the power of the Catholic Church, and reimposed capital punishment for sacrilege, which ;ed to major conflicts with the liberal-majority of the Chamber. Charles also approved the French conquest of Algeria as a way to distract his citizens from domestic problems, and forced Haiti to pay a hefty indemnity in return for lifting a blockade and recognizing Haiti's independence. After losing having his own conservative government defeated by the French legislative elections, He responded with the July Ordinances disbanding the Chamber of Deputies, limiting franchise, and reimposing press censorship. Within a week France faced urban riots which led to the July Revolution of 1830, which resulted in his abdication and the election of Louis Philippe I as King of the French."
 france_primer_event.2.f: "If the populace knew with what idiocy they were ruled, they would revolt - Charlemagne"
 
 france_primer_event.3.t: "The July Revolution"
 france_primer_event.3.d: "The French Revolution of 1830, also known as the July Revolution, Second French Revolution, or Trois Glorieuses ('Three Glorious (days)') led to the overthrow of King Charles X, The French Bourbon monarch, and the ascent of his cousin Louis Philippe, Duke of Orléans. The Revolution marked a shift from one constitutional monarchy, under the restored House of Bourbon, to another, the July Monarchy, and the replacement of the principle of hereditary right by that of popular sovereignty.This renewed French Revolution sparked an August uprising in Brussels and the Southern Provinces of the United Kingdom of the Netherlands, leading to separation and the establishment of the Kingdom of Belgium. The example of the July Revolution also inspired unsuccessful revolutions in Italy and the November Uprising in Poland. It is not certain how long the Monarchy will remain, as the July Monarchy remains doubtfully popular, but disliked for different reasons by both Right and Left."
 france_primer_event.3.f: "The only thing I learn from my mistakes is how to make them more spectacular - French Proverb"
 
 france_primer_event.4.t: "An Empire Still"
 france_primer_event.4.d: "Though our Empire may no longer control the lands it did under Napoleon or even before we hold our many colonies and considerable European borders with firm guidence, knowing well their potential. As colonialism grows quickly in importance and global trade become more the defining factors of a great power, we are among few equals in this regard. If we are able to out manuever the British and other fledgling great powers with our natural bounty our ascendence once more to superpwoer status is all but assured. However, in order to achieve this we will need to find allies, as most of Europe still remembers well our recent actions and the destruction and conquest we caused. "
 france_primer_event.4.f: "I am the state - Louis XIV"
 
 portugal_primer_event.1.t: "Aftermath of the Liberal Wars"
 portugal_primer_event.1.d: "It has been two years since the end of the six-year long Liberal Wars, another front of the grander struggle between reaction and liberalism in Europe. The United Kingdom and France supported the victorious liberal faction of Pedro I while Russia and the Carlists in Spain supported the conservatives under Miguel I. Unfortunately, Dom Pedro would die of tuberculosis only months before his victory leaving his young daughter Maria as the country’s ruler. The 16 year old queen is rumored by many in court to be a forward thinking ruler wishing to bring Portugal into the modern age. She keeps written correspondence with a number of European nobility, liberal thinkers, and even the heir apparent of Great Britain, Princess Victoria of Hannover. However, Queen Maria must maintain a careful balance between the liberal constitutionalists and the reactionary forces in the military or church if she wishes to avoid another civil war. Only time will tell how the young queen's reign bodes for the country still healing from from the scars of Napoleon and civil strife."
 portugal_primer_event.1.f: "Here it is done, here it is paid \n-Portugese Proverb"
 portugal_primer_event.1.a: "Tell me more"
 portugal_primer_event.2.a: "Lets get started"
 
 portugal_primer_event.2.t: "Explorers No More"
 portugal_primer_event.2.d: "Prince Henry the Navigator once looked out over bay of Lisbon, and through the wisdom that defined his life realized that the ocean was the only way to power and wealth. Now is a moment where a descerning individual would realize that we will never again be the explorers of old, but trade and colonialism is as relevant as ever. We once had a massive empire which spanned the planet, but with Brazil independent, and our holdings in Asia long seized by the Dutch and British we have little left to build upon. However, Yet it is our status as one of the middle nations of Europe, combined with our maritime traditions that prove to be the catalyst for our resurgence. The British and French are hated the world over, while we are not. It is time to reinforce our old economic ties and bring our old colonies back into the fold through either diplomacy or war. If we are careful and build upon our naval strength and traditions we could be great once more. "
 portugal_primer_event.2.f: "As for me, I am tormented with an everlasting itch for things remote. I love to sail forbidden seas, and land on barbarous coasts \n-Herman Melville"
 
 russia_primer_event.1.t: "Russia after Napoleon"
 russia_primer_event.1.d: "Russia, claimed by many to be the home of the sturdiest, and most hardworking people on earth, have proved themselves by winning the Napoleonic wars. Although victorious, Russia lay broken. Chairs and beds lay dormant as the sons that were supposed to return joyfully from campaign never did. Entire towns were removed from maps either due to destruction or depopulation. And now, 20 years after the end of these horrific wars, Russia stands tall with pride, establishing itself as a colossus on the European stage, with a large army and an economy to support it."
 russia_primer_event.1.f: "Though the nation has recovered the scars will never heal."
 russia_primer_event.1.a: "Tell me more"
 russia_primer_event.2.a: "Lets get started"
 
 russia_primer_event.2.t: "Alexander I"
 russia_primer_event.2.d: "Under Alexander I, life in Russia initially appeared to be heading towards a more liberal future, with the final dismantling of centuries-old institution of serfdom, however during his later years of reign, Tsar Alexander turned increasingly conservative, replacing foreign teachers, instituting religious education and eventually forming the Holy alliance, between Russia, Prussia and Austria, with the goal to suppress revolutionary movements similar to the French Revolution."
 russia_primer_event.2.f: " I ran from the wolf but ran into a bear \n-Russian Proverb"
 
 russia_primer_event.3.t: "A True Emperor"
 russia_primer_event.3.d: "After Alexander's death in 1825, Nikolay I, an autocrat at heart, was coronated in 1826 and began his rule with crushing the Decembrist revolt, furthering his paranoia and dampening any spirit for reform. Soon after his coronation he began centralizing power further under his rule, revoking Bessarabian autonomy in 1828 and Poland's constitution in 1830. Only the Grand Duchy of Finland, which had loyally sent troops to put down the Polish revolt of 1830 was spared. Though he had little taste for liberal reform, he knew serfdom was one institution that had to be changed, due to the simple reason that if Russia was to thrive, ordinary Russians being conscripted must have a reason to fight, and not to return to a petty noble's lands to farm until their deathbed."
 russia_primer_event.3.f: "I will not see the destruction of the christian converts who are loyal to me, and to my last breath I will fight for the orthodox faith \n-Ivan IV Vasilyevich"
 
 russia_primer_event.4.t: "A Land Of Servitude"
 russia_primer_event.4.d: "Russia is built upon hardship and violence. The land was conquered by Kiev from tribes and hard people, willing to fight and die for almost nothing. The cold makes for a good teacher, though some will never learn its lessons. The church exerts a massive amount of power over the Tsar and people of our nation and they are not to be ignored. It is from their authority and the harsh traditions of our people that serfdom continues. A system where a man is beholden to the land he is born upon and nothing but a slave to his landowner. Although this system makes our nobility rich it makes us weak as our people are stuck as poor, impoverished subsistence farmers.
 russia_primer_event.4.f: "It is my great desire to reform my subjects, and yet I am ashamed to confess that I am unable to reform myself \n-Peter The Great"
 
 belgium_primer_event.1.t: "Belgian Freedom, Belgian Resilience, Belgian Heritage"
 belgium_primer_event.1.d: "After years of Austrian and French Rule the Belgium people are finally independent. The Belgian Revolution of 1830 was a turning point for the nation of Belgium, we decided our fates and fought back against the Dutch Oppressors, securing for ourselves a nation for our own. After our independence was guaranteed by the Great Powers, a national congress was created. Fears of mob rule like in the French Revolution, stirred in the hearts of the nobility. In order to stem this tide it was decided that Belgium would be a popular, constitutional monarchy. Many candidates were looked at in order to fulfill this role but the Congress chose Leopold of Saxe-Coburg-Gotha, due to his extensive military career fighting for the Russian Empire during the Napoleonic wars as well as being connections to the other monarchs of Europe. Then it was so in July 1831 The constitution developed by the National congress was implemented. Belgium would Stand."
 belgium_primer_event.1.f: "Let my armies be the rocks, and the trees, and the birds in the sky \n-Charlemagne"
 belgium_primer_event.1.a: "Tell me more"
 belgium_primer_event.2.a: "Lets get started"
 
 belgium_primer_event.2.t: "The Treaty Of London"
 belgium_primer_event.2.d: "During the Belgian Revolution, five major European powers convened together. The London Conference of 1830, attended by Austria, Britain, France, Prussia and Russia was a stage for diplomacy to thrive. These nations agreed to permanently guarantee Belgian Independence. This was ignored by the Dutch who were strongly opposed and in retaliation launched a failed invasion in 1831. It was not until 1839 that the Dutch Accepted the decision. Historians will say that this was a frustrating and humiliating experience for the Belgians as it involved the loss of territory in Luxemburg and Limburg under the settlement terms."
 belgium_primer_event.2.f: "The word that is heard perishes, but the letter that is written remains \n-Belgian Proverb"
 
 belgium_primer_event.3.t: "Belgium's Future"
 belgium_primer_event.3.d: "The Lion of Belgium roars. Its people are finally free of oppression and given access to what is considered to be one of the most modern government systems in Europe. The Belgian nation will wish to secure its position in Europe as the power balance of Europe is always moving. Diplomats will be sent to each major nation to improve relations and reaffirm the Guarantee of Belgian Independence. Great Britain’s statement has been met with a sigh of relief by the King and the Parliament as having the world's super power protecting your freedoms creates some comfort in our lives. Industrialisation is key, our nation is one of the first to have this revolution and we shan’t waste it. Our population is small but we will become the gateway to Europe, providing resources and items that the Europeans may lack. Trade delegations will be sent around the world to secure goods for the Belgian people so that we may thrive in this ever growing industrial space. "
 belgium_primer_event.3.f: "My talent is such that no undertaking, however vast in size... has ever surpassed my courage \n-Peter Rubens"
 
 belgium_primer_event.4.t: "De Oranjes"
 belgium_primer_event.4.d: "The people of the lowlands have always been threatened by the surrounding powers throughout history and have experienced a joint History of Oppression. Our paths diverted as the Dutch started to take the role of the oppressor against the Catholic Flemish and Walloon people after the independence of the Netherlands. We demanded our freedom to devout our faith in the Catholic church and demanded the representation of our people by a fair government, not a Dutch king. Our neighbor to the north will always desire that which is ours, our only path to security is economic power and military exceptionalism!"
 belgium_primer_event.4.f: "The beautiful is less what one sees than what one dreams \n-Belgian Saying"
 
 prussia_primer_event.1.t: "Prussian Exceptionalism"
 prussia_primer_event.1.d: "Prussia is a nation of humble beginnings, born out of the old Duchy of Brandenburg. What differentiated this nation from so many others in the Holy Roman Empire was the House of Hohenzollern which ruled over it. Originally a family from southern Germany, they inherited lands in the north and quickly made them their own. Generations of careful administration and minor expansion compounded until it became one of the larger states in the northern Europe. However, it was King Freidrich the Great who made it into true great power, with his tactical genius, unending ambition, and courage. Prussia was forged during his reign through fire and blood, with the darkest days of the Seven-Years War seeing our nation fight off most of the European great powers at once. The successes of his wars over Austria and their allies despite overwhelming odds would eventually be compounded by several partitions of Poland. By the Napoleonic wars, Prussia was the undisputed power of the region alongside Austria."
 prussia_primer_event.1.f: ""
 prussia_primer_event.1.a: "Tell me more"
 prussia_primer_event.2.a: "Lets get started"
 
 prussia_primer_event.2.t: "The Napoleonic Wars"
 prussia_primer_event.2.d: "The Coalitions against Napoleon saw the fortunes of Prussia rise and fall several times, before eventually walking out of the Congress of Vienna a global power. In the wars against the French Republic, Prussia fought against the upstart extremists, seeking like many to reinforce the old order. As the war grew increasingly costly Prussia sought peace and left the coalition. During this period of instability, we would force our influence on many Germanic states, even occupying British-allied Hanover. When Napoleons Empire became too much of a threat to ignore any longer, the peace was broken and over the years that followed would fight desperately. Prussia was pivotal in the destruction of Napoleon throughout his wars against Europe and particularly in the battle of Waterloo. At the Congress of Vienna which defined the system and borders of Europe at the end of the war, we gained broad swaths of territory across northern Germany, though losing some small concessions such as in Poland. "
 prussia_primer_event.2.f: ""
 
 prussia_primer_event.3.t: "Political Reforms"
 prussia_primer_event.3.d: "The failures of the state and King to protect the nation in the Napoleonic wars demanded reform, for without it Prussia would surely fall to other powers. Baron vom Stein seeing the writing on the wall and wishing for something more born out of the modern era implemented the beginnings of drastic reform. His changes would result in a drastic reduction of the power of the King, for the benefit of a centralized governmental authority and system. In the past Prussia was divided into regions and decentralized in governmental scope. In addition, the beginnings of a parliament were created in a council of advisors who would at this time primarily still be aristocrats, and the Kings favorites though this is quickly changing into a proper political body. In addition, the many areas owned by Prussia as well as the newly acquired ones were properly reorganized into states with appropriate systems of management."
 prussia_primer_event.3.f: ""
 
 prussia_primer_event.4.t: " Military Reforms"
 prussia_primer_event.4.d: "The military defeats of the recent coalition wars were a lesson in humility for the military powerhouse. Many still thought Prussia far above the rest of Europe, despite Frederick the Great being long buried. Clausewitz and the other veteran officers spearheaded military reform that saw the old aristocratic officer system being gotten rid of, though, in reality, it took time to fully set in. Men of minor status could rise the ranks through merit, though the aristocrats still had major advantages. In addition, military service was instituted allowing a larger amount of men from the Kingdom to be trained and prepared to serve their nation in the event of total war as seen so recently. The military academy of Prussia also drastically reevaluated warfare in the post-Napoleonic era and improved officer training to match the modern system. "
 prussia_primer_event.4.f: ""
 
 prussia_primer_event.5.t: "Frederick William III"
 prussia_primer_event.5.d: "Frederick William III of Prussia has guided our nation for 40 years during which Prussia survived the wars against Napoleon and found itself one of the pinnacle powers of Europe. Despite his successes and promise of reform in his younger years the rule of King Frederick III is an inconsistent one, defined by insecurity. Never willing to delegate that which he can do himself out of mistrust he has cultivated a reputation of incapacity. With the necessary reforms that came out of the post-war period, he fought against them at every opportunity, resulting in much of his power being taken away. The monarchs of Prussia have been defined in their capacity and often genius, Frederick does not share in his ancestor's talent. The recent years of the King have centered almost entirely around the creation fo a singular protestant church in Prussia. Born out of a desire to have the King aand state be the head of a universal church like the Anglicans in Britain, he has succeeded only through coercion and at the cost of large migrations of his people out of the country to new lands across the Atlantic. Most in Prussia wait earnestly for death, hoping his son and heir Frederick William IV to be a more capable man…"
 prussia_primer_event.5.f: ""
 
 egypt_primer_event.1.t: "The Children Of Pharoahs"
 egypt_primer_event.1.d: "Our nation is as old as civilization itself, being of the first to form in the fertile crescent. The Early Kingdoms of Egypt had an incomparable level of wealth, power, and organization all under the watchful eye of the Egyptian Gods and their children the Pharoahs. The great history of our people lies in burial grounds, ruins, and most obviously the great pyramids, which serve as timeless symbols of our ambition and power. Though as history continued and the conquests of Alexander and Rome would lay us low, we never lacked power. The Black Death which ravaged the world, carried to Europe and the Middle East by the Mongol Hordes, would ravage our population - something to which we have still yet to recover from."
 egypt_primer_event.1.f: ""
 egypt_primer_event.1.a: "Tell me more"
 egypt_primer_event.2.a: "Lets get started"
 
 egypt_primer_event.2.t: "Ottoman Egypt"
 egypt_primer_event.2.d: "After the Mamluks were defeated by the Ottoman Empire, Egypt was made an Eyalet of the Ottman Empire. With the Mamluks continuing to maintain huge amounts of power in the region, Egypt remained highly autonomous within the Eternal State. The balance of power would move between various factions but those who remained constant were the Pashas of the Empire, the Mamluks who kept power, and the local military. Rebellion, dissent, and corruption ran rampant in the region throughout the 350 years they ruled. This autonomy would prove to be of little consequence in the Ottoman Empire’s glory days, yet as it declined and grew stagnant it would prove to be disastrous."
 egypt_primer_event.2.f: ""
 
 egypt_primer_event.3.t: "Napoleon's Invasion"
 egypt_primer_event.3.d: "The French, under the command of Napoleon at the behest of the Republic, sought to curb British power and economic dominance by bringing Egypt under their control. The initial invasion saw French naval power obliterated by Lord Nelson, but on land, they defeated the Mamluks and Ottomans with little issue. Napoleon did his best to make himself appear a friend to our people, even embracing the tenants of the prophet and instituting many political and economic reforms. The French brought western ideas of democracy and representation as well as inventions like the printing press. He was the catalyst for modern Egypt and the realization of western power in the great Muslim world. Yet the harsh taxes he instituted would stop our people from ever truly embracing him. In the end, the British and Ottomans pushed the French out, but not before leaving much lasting change."
 egypt_primer_event.3.f: ""
 
 egypt_primer_event.4.t: "Muhammad Ali"
 egypt_primer_event.4.d: "A civil war in Egypt between the Mamluks, Ottomans, and Albanian soldiers resulted in a most unlikely man coming to power. Muhammad Ali was ambitious, intelligent, and capable commander. He forced the Sultan of the Ottoman Empire to acknowledge his autonomy and eventually full independence. His rule saw wars against Arabia to put the tribes in their place, the ousting of the Mamluks from power, and a failed attempt to reform the military to the standards of the west. The latter of which caused a mutiny that would permanently stop his attempts at military reform. Economically he took the radical step of abolishing all privately held farmland, displacing a landowner class that had ruled for centuries. With near total power in Egypt, Muhammad Ali would create state-run monopolies for cotton and textile weaving in an attempt to industrialize the nation. This combined with the widespread growing of cotton and exports to the west would bring him much wealth and catapult Egypt's prospects forward. On the other hand, it showed the west yet again just how valuable Egypt was…"
 egypt_primer_event.4.f: ""
 
 egypt_primer_event.5.t: "The Not So Sick Man"
 egypt_primer_event.5.d: "At present, we control much of Syria, the Levant, and Egypt proper. The Sick Man of Europe remains our sovereign in name alone, and under the rule of our Khedive, we have the upper hand for the first time in over 300 years. Yet this position is not as it might appear, the European Powers watch with interest for both our next move and that of the Turks. The decline of the Ottoman State will continue as it has for the last few decades, but we must remain ever-wary, for the Sultan continues to watch us carefully from the north, waiting for a moment of weakness to crush Muhammad Ali's ambition."
 egypt_primer_event.5.f: "I am well aware that the Ottoman Empire is heading by the day toward destruction. On its ruins I will build a vast kingdom up to the Tigris and Euphrates. \n-Muhammad Ali Pasha detailing his ambitions."

 qing_primer_event.1.t: "The Richest Empire In The World"
 qing_primer_event.1.d: "Since our dynasty's rise to power in 1644, our empire has reached the pinnacle of its glory. The realm has never been as extensive, wealthy, and populous as it is now. This prosperity is mainly attributed to the remarkable advancements in agricultural production and the crafts. We produce and trade exquisite goods such as tapestries, pewter, lead, saltpeter, tea ceramics, porcelain, lacquer, and paper. Although we have adopted a cautious approach towards foreign relations, we have never truly isolated ourselves from the world. Our exports, which flow through the port of Canton to the rest of the world, have enriched us substantially via customs duties."
 qing_primer_event.1.f: ""
 qing_primer_event.1.a: "Tell me more"
 qing_primer_event.2.a: "Lets get started"
 
 qing_primer_event.2.t: "Our Influence Over The World "
 qing_primer_event.2.d: "Our civilization has greatly influenced the Korean peninsula, the north of the Indochinese peninsula, and Japan, in areas such as political thought, culture, language and philosophy. The testament to this is the Chinese script in use throughout Dai Nam, Korea and Japan as their principal writing systems. Despite challenges, such as the Russian Empire's invasion in 1656, we were able to defend our sovereignty and force them to open an embassy in Beijing. Our great scientists have invented numerous illustrious creations, such as silk, porcelain, the rudder, the crank, the compass, movable type printing, gunpowder, the crossbow, and vaccination, which have spread throughout the world. The Chinese way of ruling and philosophy has also inspired European thinkers such as Gottfried Leibniz, Voltaire, and Adam Smith, who recognized the virtues of our civilization."
 qing_primer_event.2.f: ""
 
 qing_primer_event.3.t: "The Imperial System"
 qing_primer_event.3.d: "China is governed by a centralized, autocratic, and bureaucratic system. The emperor rules with the aid of mandarins, a class of technocratic and literate officials, rigorously selected through the imperial examination system. The legitimacy of the ruling emperor is derived from the Mandate of Heaven, which holds that if they fail to protect and provide for their people, they will be replaced by another dynasty. The society is essentially agrarian, with a strong family structure that is hierarchical and patriarchal, extending to all aspects of society. In addition to agrarian and ancestor cults, the predominant religion since the 15th century is an amalgamation of moral and mystical doctrines drawn from Confucianism, Taoism, and Buddhism."
 qing_primer_event.3.f: ""
 
 qing_primer_event.4.t: "The Challenges To Come"
 qing_primer_event.4.d: "With peasant revolts, uncontrolled population growth, increasing corruption in the administration, and the rise of anti-Manchu secret societies, the Empire has many issues to deal with. The major Han population remains resentful of our rule, with the Manchu Queue we've imposed on them remaining as the ultimate symbol of their submission. Ensuring the power of the Manchu minority will be difficult in the long term if we do not manage to address the growing demands of the Han population. To address those issues and compete with the western powers, we need to consider a modernization of the empire. However, the bureaucracy, more concerned about the stability of the realm, and opposed to any changes to Chinese culture and our millenia-long Confucian tradition, will definitely be an obstacle."
 qing_primer_event.4.f: ""
 
 qing_primer_event.5.t: "The Opium Trade"
 qing_primer_event.5.d: "China's trade with Europe increased in the second half of the 18th century, but in the 19th century, Great Britain and other Western powers criticized China's trade policies. China's government restricted trade to the merchant classes in Guangzhou, causing Western powers to denounce these trade barriers. Despite British attempts to renegotiate trade relations, China maintained its isolationist stance. As a result, Britain began exporting opium to China, in violation of China's 1729 prohibition edict. This opium trade has destabilized China's economy and caused a shortage of silver coins. China's leaders are currently considering how to respond to this issue, but banning opium exports would anger Britain, while allowing the trade would result in a public health disaster."
 qing_primer_event.5.f: ""

 eic_primer_event.1.t: "Formation of the Company Charter"
 eic_primer_event.1.d: "The British East India Company (EIC) was formed in the year 1600, through a royal charter by Queen Elizabeth I. This charter, named Governor and Company of Merchants of London trading into the East Indies, effectively awarded the company a monopoly on English trade from the east of Africa to the west of South America. This charter gave the company such trading rights for a period of 15 years, though later charters that extended their power would begin extending their rule for 20 years at a time. This charter formed the early beginnings of English influence and control over the Indian subcontinent. The first company ships landed at Surat in the Gujarat subah (state) in 1608, with the company establishing its first Indian factories between 1610-1615. In its early days, the company competed with various Dutch, French, Spanish, and Portuguese expeditions and traders for control over trade in the region, particularly the very lucrative spice trade. Their relationship with Dutch traders from Vereenigde Oostindische Compagnie (VOC) was particularly tense, and was partially the cause of four wars to be fought between the English (later British) and the Dutch in the 17th and 18th centuries. Early EIC trade was focused around valuable spices indigenous to the region, before fabrics and textiles became a major export of the EIC to Britain."
 eic_primer_event.1.f: ""
 eic_primer_event.1.a: "Tell me more"
 eic_primer_event.2.a: "Lets get started"
 
 eic_primer_event.2.t: "Establishment of a Trade Monopoly in India"
 eic_primer_event.2.d: "Around 1670, in an effort to strengthen the position of the company, King Charles II of England granted the EIC increased jurisdiction over the Indian subcontinent, as well as rights to expand territory and mint money autonomous of the English throne. This series of acts set the stage for increased EIC influence and control over India, as the company aimed to hold a monopoly over all trade in the Indian Ocean. Over the next century, the company used their newfound wealth and political power to lobby Parliament into further securing their monopoly on Indian trade. While for a short period of time there was a parallel English trading company that was a source of competition for the EIC, the two companies eventually merged in 1708, as the United Company of Merchants of England Trading to the East Indies. For over a century, the EIC enjoyed an effective monopoly over British trade in India and China that was protected by the British Crown. By 1720, approximately 15% of British imports came from India, almost all of which was controlled by the company."
 eic_primer_event.2.f: ""
 
 eic_primer_event.3.t: "Expansion of Company Territory and Formation of Presidency Armies"
 eic_primer_event.3.d: "During the late 18th and early 19th century, the Company, under the leadership of Governor-Generals Marquess Wellesley (1798-1805), and the Marquess of Hastings (1813-23), expanded its territory and sphere of influence in India. This was achieved both through diplomatic channels and alliances made with local leaders, as well as through forceful conquest. The EIC first began using Indian sepoys, or infantrymen, to protect company assets. Eventually by the late 1700s, the EIC had formalized these sepoys into three presidency armies, one for each presidency, or province of British India. These armies were made up of Indian sepoys, trained and supplied by British officers. "
 eic_primer_event.3.f: ""
 
 eic_primer_event.4.t: "Downfall of Company Rule"
 eic_primer_event.4.d: "In the last stages of the 18th century, the British Empire began to slowly centralize control of India towards the Crown, and away from the company. The beginning of the EIC’s loss of power and control over India and its trade monopoly began in 1793, with the Charter Act stating that all political functions of the company are on behalf of the British Crown. The EIC trade monopoly lasted in effect until 1813, when British Parliament, while continuing to extend the company’s charter to administer the lands by an additional 20 years, effectively ended the company’s commercial monopoly over trade in the region. While the company still had rights to administer British lands in India, a clause in this act affirmed the British Crown’s undoubted sovereignty over all company territories, as well as opening up India to Christian missionaries for the first time. The only trade monopoly that remained in control of the EIC after 1813 was tea trade with China, though this would not last much longer either. 20 years later in 1833, British Parliament ended the commercial activities of the EIC, including this trade monopoly over tea to China, leaving the company with purely administrative functions in India."
 eic_primer_event.4.f: ""

 japan_primer_event.1.t: "The Tokugawa Shogunate"
 japan_primer_event.1.d: "The Tokugawa Clan originated from a branch of the Matsudaira Clan in Mikawa Province during the Sengoku Jidai. At first vassals of the Imagawa and later the Oda, the patriarch of the Tokugawa, Ieyasu, would claim ultimate victory over the rival daimyo at the Battle of Sekigahara, going on to form a new Shogunate that would put an end to over a century of intermittent warfare between rival clans. The formation of the Tokugawa Shogunate ushered in the Edo Period, named for the Shogunal capital in the city of Edo. Under the Shogunate, religious institutions were placed under the patronage of the Shogun, using the ideals of Neo-Confucianism espoused by Buddhist monks as tools of bureaucracy and control. Neo-Confucianism also provided the base of the Tokugawa social hierarchy, with peasants, craftsmen and merchants at the bottom, the samurai in the middle, and the daimyo on top - who nevertheless were subject to the authority of the Shogun, who in turn was at least nominally subject to the authority of the Emperor."
 japan_primer_event.1.f: ""
 japan_primer_event.1.a: "Tell me more"
 japan_primer_event.2.a: "Lets get started"
 
 japan_primer_event.2.t: "Christianity and Sakoku"
 japan_primer_event.2.d: "During the Sengoku period preceding the Battle of Sekigahara, the Japanese made contact with Portuguese traders in 1543, who established trade links from Goa to Nagasaki. The Portuguese brought knowledge of gunpowder, which quickly spread throughout Japan as Daimyos looking for an advantage over their rivals adopted firearms en-masse. Spreading equally as quickly as firearms however, was Christianity, brought to the country by the Jesuits who had accompanied the Portuguese. By 1600, Japan had over 300,000 Christians on its soil, with even some Daimyo having converted to the foreign religion. Following a Christian rebellion in Shimabara in 1637, the Shogunate implemented the policy of Sakoku, meaning 'closed country', expelling Portuguese traders, persecuting the remaining Christian population and permitting only the Chinese, Koreans, Ainu and Dutch to trade at designated ports.
 japan_primer_event.2.f: "No Japanese ship nor any native of Japan shall presume to go out of the country; whoever acts contrary to this, shall die... \nThe whole race of the Portuguese, with whatever belongs to them shall be banished to Macao. \nAll who propagate the doctrine of the Catholics, or bear this scandalous name shall be imprisoned. \n\n-Excerpts from the Sakoku Edict"
 
 japan_primer_event.3.t: "Samurai - Warriors No More"
 japan_primer_event.3.d: "Over the two-hundred years of peace brought about by the Tokugawa Shogunate, the once-famed Samurai class has been thoroughly domesticated. Brought into service as bureaucrats of the Tokugawa administration, they have exchanged their swords for pens and their bows for paintbrushes. The Samurai are now the foundation of the Tokugawa-aligned nobility, and are unlikely to favour any loss in position within the social hierarchy for them or their benefactors. While some samurai still practice weapon drills, no real warfare in the last two hundred years has meant that the only military writings not translated from the Dutch or Chinese are over two centuries old."
 japan_primer_event.3.f: ""
 
 japan_primer_event.4.t: "The Daimyo" #The Daimyo (covers Shinpan, Fudai and Tozama Daimyo, the differences between them and why this was an issue)
 japan_primer_event.4.d: "Within the Daimyo themselves there are internal divisions. The Tokugawa Shogunate classed the Daimyos themselves into three categories. The first of these, known as the Shinpan consisted of branches of the Tokugawa Clan and its parent Matsudaira Clan that were not within the line of succession. While their holdings were vast, they were excluded from political office as a result of their familial ties with the Shogun. \nThe second class, known as the Fudai, comprises the Daimyo who had sided with the Tokugawa Clan before, or at the Battle of Sekigahara. The Fudai formed the vast majority of the Shogunate's political class, often occupying small domains in key strategic locations along Japan's main highways or in the Kanto region near Edo. High-ranking posts within the Shogunate such as the rōjū were typically assigned to the Fudai, with the Fudai consequently dominating the bureaucratic bodies of the Shogunate in Edo. Last but not least are the Tozama Daimyo, who consist of several major clans who remained neutral or opposed the Tokugawa at Sekigahara, but afterwards swore fealty. Most rule vast estates, but are excluded from political office for their perceived disloyalty; a fact that has driven much resentment over the past two centuries."
 japan_primer_event.4.f: ""
 
 japan_primer_event.5.t: "Sankin Kotai"
 japan_primer_event.5.d: "To control the Tozama Daimyo, as well as prevent the Fudai Daimyo from growing too influential within the Shogunate, the Tokugawa Clan implemented the system of Sankin-Kōtai - alternate attendance. Under the system, most daimyo were required to alternate between living in their home estates and in the Shogunate capital of Edo every year. In addition to making the Daimyo easier to monitor, the forced cost of maintaining residences in both their domain and Edo, as well as the cost of journeys to-and-from the capital was a constant drain on their finances, keeping them militarily weak."
 japan_primer_event.5.f: ""

 japan_primer_event.6.t: "Dejima and Rangaku"
 japan_primer_event.6.d: "Given the dubious privilege of being the only Europeans allowed to trade with Japan, the Dutch were granted Dejima off the coast of Nagasaki, allowing for the Shogunate to keep abreast of developments both political and technological across the wider world. The art of Rangaku, or Dutch Studies, while at first limited and highly controlled, soon blossomed after the lifting of a ban on imported books in 1720, with thousands of books regarding medicine, agriculture, astronomy and industrial technology being translated and sold to middle-class urbanites within the cities of Edo, Kyoto and Osaka."
 japan_primer_event.6.f: ""

 japan_primer_event.7.t: "The Future of the Shogunate" #Future of the Shogunate, mentioning shintoism and the Emperor, and the discontent still simmering with the Tozama Daimyos
 japan_primer_event.7.d: "As the Sun rises on the 7th year of the Tenpo Era, in the 7th year of the Emperor Ninko, Japan faces the aftermath of the Great Tenpo Famine, the latest in a quick succession of natural disasters and grave accidents that have shaken the peoples' belief in the rule of the incumbent Shogun, Tokugawa Ienari. Unrest continues to simmer, with the Tozama Daimyos of Satsuma, Choshu and Tosa still holding grudges against the Shogunate that they have yet to settle. And then of course, there is the Emperor - the descendant of the Sun God Amaterasu and the nominal supreme authority over all of Japan. In these troubling times, will Ienari be one of the final Tokugawa Shoguns or will his line recover and bring Japan to greater heights of prosperity and greatness? Will the Tozama Daimyos finally rise up to claim the glory and prestige they have long been denied? Or like the Kenmu Restoration of old, will the Emperor grow tired of the failures of the Shogun, and set about to put the affairs of state back into the hands of the Imperial Court once again? 
 japan_primer_event.7.f: "Life is like walking along a long road shouldering a heavy load; there is no need to hurry.\nOne who treats difficulties as the normal state of affairs will never be discontented.\nPatience is the source of eternal peace; treat anger as an enemy.\nHarm will befall one who knows only success and has never experienced failure.\nBlame yourself rather than others.\nIt is better not to reach than to go too far.\n\n–Tokugawa Ieyasu's Guidance to His Successors"

 sokoto_primer_event.1.t: "Sokoto"
 sokoto_primer_event.1.d: "Sokoto’s prominence as a West African state began with the charisma and successes of Usman dan Fodio, who had been a prominent Islamic scholar and preacher for many years in the city of Gobir. This was disrupted when King Yunfa took the Hausa throne. Though Usman had helped Yunfa succeed his father and was his former teacher, Yunfa and Usman came into conflict over the reforms that Usman desired, culminating in the King personally attempting to assassinate Usman. The pistol had instead misfired, wounding the King’s hand, and resulted in the King allowing Usman to leave and be exiled from the city-state. Conflict between the two continued to escalate when Yunfa seized Muslim captives at the town of Gimbana, but when the captives passed through Usman’s hometown of Degel, the captives' release was somehow negotiated. Yunfa demanded that the captives be returned, but all demands were ignored by Usman. Yunfa then threatened to destroy the town of Degel, and in response Usman and his followers fled to the city of Gudu in 1804…"
 sokoto_primer_event.1.f: ""
 sokoto_primer_event.1.a: "The Fulani Wars"
 sokoto_primer_event.2.a: "Lets get started"
 
 sokoto_primer_event.2.t: "The Fulani Wars"
 sokoto_primer_event.2.d: "Once Usman dan Fodio fled to Gudu, he quickly began to gather regional support and was dubbed “Commander of the Faithful” by his followers. Usman then declared a Jihad against the Hausa kings, rallying more religious warriors to his cause, and proceeded to fight a prolonged war against the kings, even garnering support from non-muslim Fulani who chafed under the high taxes and despotism of their sovereigns. Dan fodio’s forces captured the states of Katsina and Daura, then Kano, and finally returned to the city of Gobir as a conqueror in 1809. That same year you, Muhammed Bello dan Fodio, son of Usman, established the city of Sokoto as the capital of the Sokoto state. And so the Sokoto Caliphate was born."
 sokoto_primer_event.2.f: ""
 
 sokoto_primer_event.3.t: "The Caliphate of Sokoto"
 sokoto_primer_event.3.d: "Sokoto’s conquests continued into Yorubaland, and quickly became one of the largest states in Africa. The Sultan of Sokoto ruled from its namesakes capital, but the leader of each emirate was given a wide amount of autonomy over their respective territories. Most of the internal growth of the state was a result of Muhammed Bello’s adaption of the ribat system. These small walled fortresses were part castle, part islamic school, and part caravanserais. These were the key elements of Sokoto’s development in creating new settlements and supporting the growth of plantations that were the cornerstone of their economy. By 1837 there was an estimated 10 million people within this state. The nation closely followed Islamic law, and the Sufi community was vital to its health as it tied in all of these emirates to the Sultan."
 sokoto_primer_event.3.f: ""
 
 sokoto_primer_event.4.t: "Sokoto Economy"
 sokoto_primer_event.4.d: "Sokoto’s economy is founded upon the West African slave trade. However, this slave trade functioned differently than the European and American models. Usman dan Fodio only allowed for slavery to occur for non-Muslims, and was viewed as a process to convert more people to follow Islam. Slaves were acquired through raiding, conquest, and trade, and it is estimated that nearly half of Sokoto’s population was enslaved during this century. Slaves were a pillar of the plantation economy that Sokoto had come to rely upon, but were not forced to be kept in labor-level jobs. It was further mediated by a lack of racial barriers that were common throughout North and South America, and through a complex system that was partially nepotistic, slaves were able to own property, free themselves of their bondage, and were able to convert to be a part of the Islamic community of freepersons. Through this complex web of a slave-based economic system, the Caliphate was able to further centralize its power and push people towards converting to Islam."
 sokoto_primer_event.4.f: ""
 
 sokoto_primer_event.5.t: "What is next for Sokoto?"
 sokoto_primer_event.5.d: "This brings us to the current era for this nation. Sokoto is surrounded by Islamic and indigenous religions, with many potential kingdoms to bring under the control of the Caliphate. There are isolated African tribes and kings who can be brought into the light of Islam, and potential allies in other African powers such as Morocco. But be warned: European expeditions have begun to press deeper into the African continent, and with them comes a threat of extinction to Sokoto’s current way of life."
 sokoto_primer_event.5.f: ""

 usa_primer_event.1.t: "Birth of the Modern Republic"
 usa_primer_event.1.d: "In 1776 a new political experiment took place, one which will test the strength of European monarchies for centuries to come. Thirteen colonies of the British Empire united together to officially declare independence from what they perceived as an oppressive regime, stating in their dissent that they will no longer be under the rule of the monarchy without any rights or autonomy. This eventually led to the birth of the first modern republic: The United States of America. Since the birth of this new nation, Anglo-Saxon settlers of the New World pushed west across the Appalachian Mountains, settling up to the Missouri river through a trail of conquest and Frontiersmen attitude that pushed the remnants of Indigenous tribes further west to make way for these new people. Over time, more of these “territories” were integrated into the country, and more state stars were added to the American Flag."
 usa_primer_event.1.f: ""
 usa_primer_event.1.a: "Tell me more"
 usa_primer_event.2.a: "Lets get started"
 
 usa_primer_event.2.t: "Missouri Compromise & the Monroe Doctrine"
 usa_primer_event.2.d: "In the 1820s, another monumental shift for the nation came from the Louisiana Purchase, opening up a brand new line of the frontier up to the Spanish Treaty Line of 1819. But with this new land came new problems, as the matter of slavery still hangs heavy above the republic. Difficult and combative debates were held in Congress, slowing the ability for the U.S. to expand as the matter of which states would be designated ‘Free States’ and which would be ‘Slave States’ took several years before a compromise was reached. The Missouri Compromise defined the division between Slave State and Free State to be at the 36°30’ Parallel, further entrenching a North-South divide in the country.In this same decade, President James Monroe forged a new Foreign Policy plan, later known as the ‘Monroe Doctrine’. This Doctrine asserted that, with the independence of many Spanish and Portuguese colonies in the New World, the Americas were to be a separate sphere of influence from the Old World. Though the U.S.A. still lacks the naval capability of enforcing this Doctrine, it is believed to lay the groundwork for the disinvolvement of colonial powers from American affairs, and instead bring about a new era of U.S. dominance."
 usa_primer_event.2.f: ""
 
 usa_primer_event.3.t: "Andrew Jackson"
 usa_primer_event.3.d: "The twilight of the 1820s is marked by one very important and prominent figure: Andrew Jackson. A known bigot who fought against the Native Americans in two wars as a General, Jackson had a long-seeded hatred of the Indigenous population of the Americas. Further, he was known as a firebrand that managed to win the plurality of the popular and electoral vote in the 1824 election, nearly achieving his presidency four years earlier. But, fearing that Jackson’s presidency would be a disaster, Speaker of the House Henry Clay threw his support in the contingent congressional election to John Adams.This further cemented Jackson’s distaste for the status quo of America’s Republican system, leading to his retirement as a Senator and returned to Tennessee to plan a new direction for the Republic. He formed a new party called the Democratic Party in an effort to undermine Adams’ presidency and ensure it would only last one term, and was successful in the election of 1828. His election heralded many investigations to remove corruption in the government, but his landmark piece of legislation was the infamous ‘Indian Removal Act’."
 usa_primer_event.3.f: ""
 
 usa_primer_event.4.t: "The Trail of Tears"
 usa_primer_event.4.d: "Even before Jackson took office, the relationship between southern states and the native tribes that lived within them was fraught with conflict. The state governments felt that they had full rights and control over their territories, while the indigenous tribes believed that they were autonomous nations that had a right to live on this land.In May of 1830, Jackson signed into law the ‘Indian Removal Act’. This federal law paved the way for the expulsion of all Indigenous tribes into the designated ‘Indian Territory’ forcing the resettlement of tens of thousands of people in an event that was known as the ‘Trail of Tears’. Though Jackson saw the emigration as voluntary, the indigenous people were given no support in the massive resettlement. Unless the U.S. government does something to radically change the direction of this law and its requisite destruction of these ‘Five Civilized Tribes’, it is estimated a third of the 60,000 indigenous people affected by this policy will die."
 usa_primer_event.4.f: ""
 
 usa_primer_event.5.t: "Abolition Movement"
 usa_primer_event.5.d: "Though the Abolition Movement had been slow to gain momentum, the formation of the Democratic Party and the Missouri Compromise had pushed it to the forefront of American politics. By 1836, there were estimated to be over 300 slave rebellions, both big and small, as African-Americans were demonstrably oppressed and repressed in abusive slave practices in the South. At the same time, abolitionists faced an overwhelming amount of hostility from Southerners and any Northern sympathizers. Because the North also relied on cheap slave labor to pick the cotton for their textile factories, the difficulty of increasing popular support of the movement was of paramount concern for abolitionists. Through the use of words rather than bludgeons, the American Anti-Slavery Society began to distribute between 25,000 to 50,000 copies of abolition propaganda and news every week all across both North and South. This incited rising tensions between abolitionists and pro-slavery groups, further compounding the divisions in the Northern United States and the Southern United States."
 usa_primer_event.5.f: ""

 usa_primer_event.6.t: "Texas and Mexico"
 usa_primer_event.6.d: "One important matter of U.S. Foreign Policy for this era was also the state of relations between the United States and the Republic of Mexico. The settlement of Anglo-Saxons in the Northeastern regions of Texas that came to outnumber the Mexican population has led to a renewed war for independence. Though the Texans cite their Anglo-Saxon heritage as legitimacy of their independence, it is of particular concern to the United States on whether or not the state should remain independent, especially given its practice of slavery. Any moves to do this, however, are sure to incite the ire of the Mexican Republic, and as the western frontier expands further towards the coast, a conflict between the United States and Mexico seems inevitable."
 usa_primer_event.6.f: ""

 usa_primer_event.7.t: "1836"
 usa_primer_event.7.d: "With a growing abolitionist movement, the choice of what direction the United States will take on the matter of slavery will determine much of the domestic policy of the U.S. for years to come. Jackson’s ‘Indian Removal Act’ is also of prime concern, as well as the continued expansion of the Western frontier and the matter of Mexico. The American Experiment is facing one of its most difficult moments in history, and it is up to you to determine whether it will succeed and rise to become a new Great Power away from Europe, or if it will diminish and falter into obscurity."
 usa_primer_event.7.f: ""

 sikh_empire_primer_event.1.t: "The Sikh Empire"
 sikh_empire_primer_event.1.d: "Greeting Maharaja Ranjit Singh it is Shukarvaar, 19 Poh, 1892 or as the foreigners say the 1st of January 1836. To remind you my lord, the history of your empire is as follows. When Emperor Aurangzeb died the Mughal empire entered a grand decline as its imperial authority waned. The collapse was locally quickened by the formation of the Khalsa and 14 Misls. Later, the Afghans commanded by Shah Mazam attempted to invade Punjab, putting an end to the Misls infighting. With cunning tactics and regional knowledge you repelled the invaders from the 12 Sikh Misls under your rule, eventually moving on to reclaim the last remaining Muslim Misls and forming the Sikh Empire."
 sikh_empire_primer_event.1.f: ""
 sikh_empire_primer_event.1.a: "Tell me more"
 sikh_empire_primer_event.2.a: "Lets get started"
 
 sikh_empire_primer_event.2.t: "Sikhism"
 sikh_empire_primer_event.2.d: "Our religion of Sikhism was founded by Guru Nanak in the 15th century with a further 9 human gurus adding their knowledge until Guru Gobind Singh created the Guru Granth Sahib the 11th Eternal and current Guru. The Guru Granth Sahib does contain wisdom not only from 6 prior gurus but 14 hindu Bhakti movement sants and a muslim sufi saint, providing a level of religious inclusivity that has allowed us to rule over our Muslim subjects who form the majority of our land."
 sikh_empire_primer_event.2.f: ""
 
 sikh_empire_primer_event.3.t: "Economic Situation"
 sikh_empire_primer_event.3.d: "Now for an overview of our economical situation much of our economy is based around agriculture. Specifically farming cereals and fabrics with another major product of our economy being liquor. This has made the upper class fabulously wealthy, with only a small middle class. The economy is subsequently underdeveloped.
 sikh_empire_primer_event.3.f: ""
 
 sikh_empire_primer_event.4.t: "MIlitary Outlook"
 sikh_empire_primer_event.4.d: "Militarily, the forces of the Sikh Empire are one of the largest in India, dwarfed only by the East India Company itself. With over 100,000 men at arms, trained in modern tactics and equipped with the latest firearms, we are one of the few remaining independent Indian states that have the military might to back up our independence. However, we must remain aware that maintaining such an army in war-time is no easy feat, and our economic capabilities must be up to the task."
 sikh_empire_primer_event.4.f: ""
 
 sikh_empire_primer_event.5.t: "Diplomacy"
 sikh_empire_primer_event.5.d: "Our diplomatic standing with other countries, especially the great powers in Europe is difficult to say, as diplomacy can be a volatile thing. Our vassals in Jammu have seized Ladakh from the Tibetans, damaging our relaitons with the Qing Dynasty to our north. To our west, the Afghan principalities lie divided after the fall of the Durrani Empire, unlikely to pose a threat as they did decades before. To the east lies the vast expanse of British India itself, with the East India Company annexing a new Indian principality by the year, and who will undoubtedly set their eyes on our domain in time."
 sikh_empire_primer_event.5.f: ""

 joseon_primer_event.1.t: "Sadae"
 joseon_primer_event.1.d: "At times, it can be difficult to discern the difference between a Korean literati and their Chinese counterparts, for at times they can prove to be utterly indistinguishable. Korean scholars have long considered China as the centre of the civilized world, and Korea as part of this Sinocentric world order. Although our culture remains distinct from that of China, we cannot deny it is greatly influenced by Chinese culture and political thought. Belonging to the Chinese culture is not a rigid concept. As it is written in the “Spring and Autumn Annals”, barbarians who adopt the ways of the Han would be accepted as Han, and Han people who adopt the ways of the barbarians would be considered barbarians. Respecting this rule, successive Korean Kingdoms, from Silla to Goryeo to the present-day Joseon have adopted a subservient attitude towards the Chinese dynasties known as Sadae - Serving the Great; adopting some of their ways with a clear desire to be included in the Sinocentric world."
 joseon_primer_event.1.f: ""
 joseon_primer_event.1.a: "Tell me more"
 joseon_primer_event.2.a: "Lets get started"
 
 joseon_primer_event.2.t: "The Hermit Kingdom"
 joseon_primer_event.2.d: "However, following the Japanese invasions of the 16th century and the overthrow of the Ming Dynasty by the Manchu Qing in 1644, the Joseon Kingdom adopted an increasingly isolationist policy that has caused it to be known as the 'Hermit Kingdom'. This period of peace, reform and isolation allowed for a renaissance in political thought with the emergence of the Silhak Movement, aiming for reformation of the administration, land management and study of agricultural techniques. From the 17th and 18th centuries, Joseon experienced a period of prosperity, in part due to the reforms of the Silhak Movement, and in part due to the excellent administrations of Kings Yeongjo and Jeongjo from 1724-1800."
 joseon_primer_event.2.f: ""
 
 joseon_primer_event.3.t: "A New Crisis Emerges"
 joseon_primer_event.3.d: "However, since the end of King Jeongjo's reign, the troubles plaguing Joseon have returned and seem to only grow further in strength. King Sunjo's reign was plagued by rebellion and anti-Catholic unrest, with the foreign religion spreading into Joseon through the clandestine efforts of foreign missionaries. The King's efforts to reform the administration failed, with the state examinations becoming increasingly disordered and corrupt. Furthermore, natural disasters and population growth led to increasing rural poverty, with many fleeing into the countryside as bandits, or crossing the Yalu River into Qing territory to find new land to settle. Following King Sunjo's untimely death in 1834, his grandson Yi Hwan has been crowned as King Heonjong of Joseon at the young age of 7. The power of the royal court has greatly diminished as the in-laws of the King, the Andong Kim and Pungyang Jo clans now fight for control."
 joseon_primer_event.3.f: ""
 
 joseon_primer_event.4.t: "The Future of Joseon"
 joseon_primer_event.4.d: "As Joseon stands at a crossroads, it is clear that urgent reform is needed lest the situation spiral out of control. The legacy of Sadae and the Sinocentric order that has long guided Korean diplomacy now faces uncertainty as the Qing Dynasty weakens and foreign influences press at its borders.  he reforms of the Silhak and Seohak movements offer paths to renewal, but their success depends on the court's ability to transcend factional strife and address the suffering of the people. The political infighting between the Andong Kim and Pungyang Jo clans must be brought to a halt, whether through cooperation or suppression, and steps taken to improve the lives of the peasantry and strengthen the military for whatever the future may hold."
 joseon_primer_event.4.f: ""
 

 canada_primer_event.1.t: "The Great North"
 canada_primer_event.1.d: "Between 1700 and 1836, the area that would later become Upper and Lower Canada was largely under French control. Lower Canada was established in the early 1700s, and it was primarily a French-speaking territory, with a predominantly French-speaking population. The French played a vital role in shaping the culture, language, and institutions of Lower Canada, leaving a lasting legacy that endures to this day. Upper Canada, on the other hand, was established by the British in 1791 and was primarily an English-speaking territory. The British saw Upper Canada as a chance to establish a loyal and reliable colony, and they went to great lengths to attract English-speaking settlers to the region. Over time, Upper Canada developed a unique culture and identity, shaped by the English settlers who arrived there. Despite their differences, Upper and Lower Canada had much in common. Both colonies were established as part of the British Empire, and both were shaped by their relationship with the mother country. Both colonies were also part of a larger struggle for power and control in North America, as the British and French vied for dominance on the continent."
 canada_primer_event.1.f: ""
 canada_primer_event.1.a: "Tell me more"
 canada_primer_event.2.a: "Lets get started"
 
 canada_primer_event.2.t: "A Crown Colony"
 canada_primer_event.2.d: "The distinct cultural and linguistic identities of Upper and Lower Canada often led to misunderstandings and conflicts between the two colonies. However, despite these differences, both Upper and Lower Canada continued to thrive and expand. In Upper Canada, new industries emerged, including agriculture and manufacturing, which contributed significantly to the growth and development of the colony. The fertile lands of Upper Canada, along with advances in agricultural technology, helped to create a prosperous farming industry. Similarly, the development of manufacturing industries, such as textiles and ironworks, helped to create new job opportunities and boost the economy. In Lower Canada, the economy was more focused on trade, with the St. Lawrence River serving as a critical transportation route for goods and people. The fur trade was also an essential industry, with fur traders establishing trading posts throughout the region. The growth of these industries helped to increase the population of Lower Canada, with new towns and communities being established along the St. Lawrence River and throughout the region."
 canada_primer_event.2.f: ""
 
 canada_primer_event.3.t: "A Cultural Divide"
 canada_primer_event.3.d: "During the period between the establishment of Upper and Lower Canada and the eventual unification of the two colonies in 1836, the British government invested heavily in building infrastructure to support economic growth. Roads, canals, and other transportation networks were constructed to improve trade and commerce between the colonies and other parts of the British Empire. However, tensions between the French-speaking population of Lower Canada and the English-speaking population of Upper Canada continued to simmer. In Lower Canada, the French-speaking population felt that their rights were being violated by the British colonial government. They believed that the British had established a system that favored English-speaking settlers, leading to the suppression of their language, culture, and political rights. The French-speaking population in Lower Canada thus fought for their rights and freedom in what is now known as the Lower Canada Rebellion of 1837-38."
 canada_primer_event.3.f: ""
 
 canada_primer_event.4.t: "The North"
 canada_primer_event.4.d: "In Upper Canada, the situation was somewhat reversed, with the English-speaking population in the majority and the French-speaking minority facing discrimination. Despite the British government's attempts to create a fair and just society, the French-speaking minority still faced obstacles in the political and economic spheres. These tensions between the two colonies were a significant factor in the eventual unification of Upper and Lower Canada in 1836. The merging of the two colonies was seen as a way to address some of the issues that had led to tensions and conflict between the French and English-speaking populations. It was hoped that a more united Canada would be able to overcome these differences and build a stronger, more prosperous nation."
 canada_primer_event.4.f: ""
 
 liangguang_primer_event.1.t: "The Settlement of Nanyue"
 liangguang_primer_event.1.d: "When the Qin conquered the Yue tribes of Nanyue, they established the twin provinces of Guangxi and Guangdong, named after the western and eastern expanses of territory they had added to their dominion. Though the Yue peoples were assimilated, their maritime traditions endured, blending with Han customs to shape Liangguang’s coastal culture. In the centuries that followed, Han settlers would develop trade links with both the rest of China as well as the wider world, gathering at the city of Guangzhou, otherwise known as Canton to the West. Guangzhou would form the eastern terminus of the Maritime Silk Road, and by the Tang Dynasty, the city hosted a thriving Arab merchant quarter. Under the Song, its ports bustled with ships from as far as East Africa."
 liangguang_primer_event.1.f: ""
 liangguang_primer_event.1.a: "Tell me more"
 liangguang_primer_event.2.a: "Lets get started"
 
 liangguang_primer_event.2.t: "The Sea Ban and Canton System"
 liangguang_primer_event.2.d: "Despite the sea ban imposed by the Ming Dynasty, Guangzhou’s reputation as the maritime gateway to Chinese trade endured. When the Portuguese arrived in Macao, the city became the ultimate destination for nearly a third of the silver mined in the Americas. The deluge of New World silver deepened Guangdong’s economic importance, binding the province to the affairs of the world even as successive Imperial dynasties clung to isolation. This state of affairs continued as the dynasties transitioned from Ming to Qing, with the cities’ status firmly solidified through the enactment of the Canton System in 1757 that limited all foreign trade to Guangzhou alone, with trade conducted and monopolized by the Cohong, a conglomerate of Cantonese merchant guilds native to the city."
 liangguang_primer_event.2.f: ""
 
 liangguang_primer_event.3.t: "The Future of the Twin Expanses"
 liangguang_primer_event.3.d: "Nearly a hundred years after the implementation of the system, the effectiveness of the Canton System is now called into question as foreign merchants, in their desperate thirst for Chinese tea and silk, bring even the vile drug that is opium to our shores for trade. The Cohong, once masters of this carefully balanced trade, now find themselves outmaneuvered by smugglers and foreign factors who flout the rules with impunity. Rumours now abound in the merchant houses of Canton and the offices of provincial magistrates that the Daoguang Emperor has had enough, and that a superintendent will soon be appointed from Beijing itself to investigate the rampant smuggling and enforce imperial edicts with greater severity."
 liangguang_primer_event.3.f: "And yet, whoever this man may be, I fear greatly for his arrival. Will he bring order, or will his heavy hand stir unrest that could choke this city’s lifeblood and leave our merchants destitute?"

 huguang_primer_event.1.t: "The Origins of Huguang"
 huguang_primer_event.1.d: "Nestled south of the Yangtze River and north of the Nanling Mountains lie the fertile lands surrounding Lake Dongting and the Gan River Basin. The land within the provinces of Hunan and Jiangxi produced grain so abundantly that it fed many parts of China with its surpluses in times of prosperity. Its waterways, linking the Yangtze to the Pearl River Delta, made it not just an agricultural heartland but a vital corridor for troops and tribute, a fact not lost on dynasties past. It was fiercely fought over between rival warlords in times of strife, for whoever controlled Huguang’s granaries held the key to dominance over the south."
 huguang_primer_event.1.f: "When Huguang is ripe, all under Heaven are fed. \n-Ming Dynasty proverb"
 huguang_primer_event.1.a: "Tell me more"
 huguang_primer_event.2.a: "Lets get started"
 
 huguang_primer_event.2.t: "Prosperity in Humility"
 huguang_primer_event.2.d: "Following the instability of the Ming collapse and the restoration of order under the Qing, Huguang once again settled into its traditional status as the breadbasket of the Middle Kingdom. Successive Qing Emperors, recognizing its strategic value, invested heavily in dike repairs and land reclamation. Improvements in land management and infrastructure, as well as renovation of the Imperial Highway between north and south, not only boosted harvests but tightened Beijing’s grip on this vital region. These changes brought Huguang’s peasantry a much more comfortable existence than that seen by other farmers throughout China, though their lives remained tethered to the whims of distant bureaucrats and the ever-present threat of Yangtze floods."
 huguang_primer_event.2.f: ""
 
 huguang_primer_event.3.t: "The Future of the Lake Provinces"
 huguang_primer_event.3.d: "However, as the Qing Empire continues to face further internal struggles, the future of Huguang hangs in the air. Will it remain the idyllic breadbasket it has been for centuries, its granaries shielding the empire from famine as they did during the Qianlong era’s golden age? Or will foreign winds once again make it a prize to be fought for by power-hungry despots, as it was during the Three Kingdoms or the fall of the Ming? And what of the peasants themselves? Will Huguang embrace the coming age of smoke and steel, its youth lured away by the factories of Canton or the coal mines of the north, and be a breadbasket no more?"
 huguang_primer_event.3.f: "Will our children still tend this land when the drums of change grow louder, or will Huguang's fields, soaked with the sweat of generations, be trampled under the boots of conquerors?"

 gansu_primer_event.1.t: "The Gateway to China"
 gansu_primer_event.1.d: "Though positioned on the western frontier of Chinese civilization, Gansu holds the honor of being the heartland of the ancient Qin, who forged the fractured Han kingdoms of the Yellow River into the first unified Chinese empire. Yet as successive dynasties shifted their capitals eastward to better rule China’s vast expanse, Gansu transformed from an imperial core to a rugged frontier—the last bastion of Han authority before the windswept deserts of the Tarim Basin. \n\nIts strategic position made it the final eastbound stop on the Silk Road, where camel caravans took their first steps into the Middle Kingdom in search of silk and jade. While Chinese goods flowed westward to Persia and Rome, the Silk Road in turn allowed for foreign faiths to flow east, with Nestorian Christians, Buddhists and Muslims soon arriving in the Middle Kingdom. Whilst the Nestorians were short lived, by the Ming era, Islam had taken root amongst a sizable portion of the region’s population."
 gansu_primer_event.1.f: ""
 gansu_primer_event.1.a: "Tell me more"
 gansu_primer_event.2.a: "Lets get started"
 
 gansu_primer_event.2.t: "The Rise of the Hui"
 gansu_primer_event.2.d: "From the intersection of Islamic faith and Chinese culture emerged the Hui, opportunistic merchants, soldiers and settlers who made the arid lands of Gansu their new home. Their relation with the rising Qing Dynasty was an uneasy one, with the Hui fighting both alongside and against the Qing, earning a reputation as fearsome, if unreliable and zealous warriors. Sectarian conflicts between various Hui Muslim sects in the 1700s saw harsh Qing reprisals, further escalating tensions between the Manchus and their Muslim subjects. Relations were somewhat repaired when both came together to oppose Jahangir Khoja’s Turkic Revolt in Xinjiang, but the devastation of the conflict left much of Gansu in disarray."
 gansu_primer_event.2.f: ""
 
 gansu_primer_event.3.t: "Repairing the Western Corridor"
 gansu_primer_event.3.d: "Decades of neglect, combined with the chaos that had occurred during the Qing’s brutal war against Jahangir Khoja merely a decade prior had left the Western Corridor in tatters. Gansu linked the Chinese heartland to its frontiers in Tibet and Xinjiang, but now its guard posts were crumbling and barely manned, with bandits prowling once secure trade and supply routes. \n\n Even worse, rumours now abound of Russian advances in Central Asia and British intrigue in the Himalayas. Can the Qing restore Gansu’s roads and with them, its grip on its Western Frontiers, or will this ancient gateway become a breach in China’s walls?"
 gansu_primer_event.3.f: ""

 manchu_primer_event.1.t: "The Origins of the Manchu"
 manchu_primer_event.1.d: "From the sacred slopes of the Changbai Mountains, where amidst eternal mist the earth touches the sky, the Manchu people first emerged. Long before we rode south to conquer empires, we were hunters and farmers, rulers of the forests and rivers. Our ancestors knew the weight of a bow and the value of a horse, but they too understood the power of diplomacy. The Ming may have called us ‘Jianzhou Barbarians’ but they accepted our tributes of furs and herbs all the same, hoping that their reciprocal gifts of silks and titles could tame us."
 manchu_primer_event.1.f: ""
 manchu_primer_event.1.a: "Tell me more"
 manchu_primer_event.2.a: "Lets get started"
 
 manchu_primer_event.2.t: "The Rise of the Qing Empire"
 manchu_primer_event.2.d: "It was the Great Ancestor Nurhaci who forged our scattered clans into a nation, binding us with the Eight Banners and the Manchu script. When disorder engulfed the Ming, he saw destiny. Under his Eight Banners, we swept south like a thunderstorm, through the Shanhai Pass into Beijing, and onto the Dragon Throne itself. From the Amur to the Pearl River, and from the Yellow Sea to the Tarim Basim we forged a new Empire. \n\n Yet victory came at a cost. As our warriors settled in Beijing and garrisoned the empire’s frontiers, our homeland grew quiet.  The best of us left for the south; to govern the Han, to garrison their cities, and in time, their roots withered and they forgot themselves. Now the towns and villages of the north stand half-empty, and the ancestral shrines are tended by old men and boys. The sacred land of our forefathers has become a relic, visited only for rituals and nostalgia."
 manchu_primer_event.2.f: ""
 
 manchu_primer_event.3.t: "Threat from the North"
 manchu_primer_event.3.d: "Now, new shadows creep across our ancestral lands. The Russians, those barbarian devils of the frozen tundra press southward, building forts where our hunters once roamed. The Treaties of Nerchinsk and Kyakhta had stalled their advance for a time, but the court in Beijing now cares more about a few opium smugglers than for the sacred soil where their ancestors lie. Worse still are the Han migrants flooding into Manchuria by the thousands. The court forbids their settlement, yet the borders leak like a sieve as our forests are turned into farms and our land claimed as their own. "
 manchu_primer_event.3.f: "What does it mean to be Manchu now? The Emperor still wears our dragon robes, but he speaks the language of the Han and bow to Confucian rites. Will the Eight Banners of Nurhaci, inherited by our children, fly proudly across the land once more or be reduced to nothing more than moth-eaten relics?"

 sichuan_primer_event.1.t: "The Descendants of Ba-Shu"
 sichuan_primer_event.1.d: "Nestled within the fertile Sichuan basin and ringed by protective mountains, Sichuan has long stood apart from the rest of China. The ancient Ba and Shu kingdoms, with their own distinct languages and traditions, flourished here long before the Qin Dynasty integrated the region into imperial China. Even after centuries of Han migration and assimilation, Sichuan retained a unique identity; an isolated, self-sufficient land, but one that was vulnerable whenever central authority waned."
 sichuan_primer_event.1.f: ""
 sichuan_primer_event.1.a: "Tell me more"
 sichuan_primer_event.2.a: "Lets get started"
 
 sichuan_primer_event.2.t: "The Yellow Tiger"
 sichuan_primer_event.2.d: "When the Ming Dynasty collapsed in 1644, Sichuan became the stage for one of the Qing Conquest's bloodiest chapters. Zhang Xianzhong, a peasant leader calling himself the 'Yellow Tiger', declared himself Emperor of the short-lived Daxi Dynasty, slaughtering Ming loyalists and depopulating vast swaths of the province. By the time the Qing restored order, Sichuan lay in ruins; its fields fallow and its cities ash. To repopulate the land, the Kangxi Emperor encouraged mass migration from neighboring provinces, reviving Sichuan's agricultural wealth with migrants from prosperous Huguang. This resettlement also extended Qing influence southward, paving the way for campaigns into Yunnan and the consolidation of the southwestern frontier."
 sichuan_primer_event.2.f: "Heaven brings forth innumerable things to nurture man. \nMan has nothing good with which to recompense Heaven. \nKill. Kill. Kill. Kill. Kill. Kill. Kill. \n\n-Inscription upon the Seven Kill Stele erected by Zhang Xianzhong"
 
 sichuan_primer_event.3.t: "Subduing the Highlands"
 sichuan_primer_event.3.d: "Sichuan's strategic position made it the gateway to the southwestern frontier of Yunnan and Guizhou, where indigenous chieftains known as the Tusi governed with minimal imperial interference. Wary of unrest, the Qing would gradually replace these hereditary rulers with state-appointed magistrates; a process that to the present date is still ongoing. However, new threats now loom. British forces have annexed much of the Burmese coast, and their traders now ply China's coasts spreading the scourge of Opium wherever they make landfall. The Qing Empire's resolve is now being tested, and only time will tell if the Qing can retain their group on the southwestern frontier, or if foreign encroachment will see their hard-won gains in Yunnan unravel."
 sichuan_primer_event.3.f: ""

 mongolia_primer_event.1.t: "Land of the Horse Lords"
 mongolia_primer_event.1.d: "The endless steppes of Mongolia have always been the domain of horsemen. Before us, the Xiongnu harried the Han, the Khitan built the Liao, and the Jurchen Jin crippled the Song. However, it was we,the Mongols, who made the whole earth tremble under the sound of our hooves. Under the great Genghis Khan - the Universal Ruler, we forged an empire stretching from Korea in the East to Russia in the West. The Qing may call us subjects now, but we remember our ancestors and their ancient glory."
 mongolia_primer_event.1.f: ""
 mongolia_primer_event.1.a: "Tell me more"
 mongolia_primer_event.2.a: "Lets get started"
 
 mongolia_primer_event.2.t: "The Decline of the Empire"
 mongolia_primer_event.2.d: "Alas, Genghis' conquests would not last. His empire would fracture into four khanates, chief among them the Great Yuan. When the Great Yuan itself fell, overthrown by Chinese peasants, we became a fractured people, fleeing north into our ancestral home. There we established the Northern Yuan, though such a name only exemplified the past glories to which we so desperate clinged to. When the Dzungars sought to dominate our lands, it was the Qing who extended an offer of alliance, and together we shattered the Dzungars so completely that their name was relegated to the history books. \n\n In return, the Qing honoured our noble houses, granting us titles and a place within their empire. Though our bows now rest more often than they are strung in service to the Manchus, they have let us keep our ways, our laws and our dignity - privileges greater than what conquerors often grant, and one which was certainly denied to the Qing's own Han subjects."
 mongolia_primer_event.2.f: ""
 
 mongolia_primer_event.3.t: "The Path Forward"
 mongolia_primer_event.3.d: "Now, the Mongol Banners stand divided. While our people endure, we are no longer the free-riders of the Steppe. In Urga, the lamas speak of this age as an age of Buddhism, where merit is won through prayer and contemplation of the Dharma, not war and conquest. But to the north, the Russians encroach ever onward, year by year, and to the south, the Qing Court grows weak, its once mighty banners plagued by opium and its coffers drained by increasing rebellion. \n The years ahead will prove pivotal in determining our destiny, whether as subjects to a renewed Qing Dynasty, or, if the worst comes to pass and the Manchu fall, that we rise once more as the lords of our own land."
 mongolia_primer_event.3.f: ""

 xinjiang_primer_event.1.t: "The People of the Silk Road"
 xinjiang_primer_event.1.d: "For millennia, Xinjiang — the New Frontier — has been less a borderland than a crossroads. Its oases and steppes hosted Sogdian merchants, Tocharian monks, and Uyghur Khans. Chinese armies once garrisoned forts along the Tarim Basin, only to retreat as dynasties rose and fell. Here, Buddhism, Nestorian Christianity, and Islam left their marks on the land, and languages as diverse as Saka, Chinese, and Turkic echoed through the markets of Kashgar."
 xinjiang_primer_event.1.f: ""
 xinjiang_primer_event.1.a: "Tell me more"
 xinjiang_primer_event.2.a: "Lets get started"
 
 xinjiang_primer_event.2.t: "The Subjugation of the Dzungars"
 xinjiang_primer_event.2.d: "The Qing Conquest of Xinjiang was born of necessity, rather than ambition. The Dzungars, having crushed the last remnants of the Chagatai Khanate, grew powerful enough to bring Mongolia under its control, and thus, placing the Qing capital of Beijing itself under threat. The Qing response was brutal; by 1759, Qing armies and the diseases they brought with them had eradicated the Dzungars as a people, scattering them amongst the other Steppe peoples and leaving their pastures empty. In their place, came Han and Hui settlers, clustered in the newly established city of Dihua - the capital of a new Qing military governorship to control this new frontier.
 xinjiang_primer_event.2.f: ""
 
 xinjiang_primer_event.3.t: "Threats to the West"
 xinjiang_primer_event.3.d: "Peace proved fragile. In the 1820s, the Turkic Warlord Jahangir Khoja invaded from Kokand, rallying Muslim rebels against Qing rule. Though defeated, his revolt exposed the Empire's precarious hold on their new frontier. At the same time, the Russians continue to push southwards, their kreposts creeping across the Kazakh Steppe towards the Ili Valley. Simultaneously, the Qing themselves are divided on how to govern Xinjiang, with Han settlers encouraged to settle the north whilst Uyghur Begs continue their grip on power in the Tarim Basin. Few resources are able to be spared for such a far flung frontier as the central government in Beijing grapples with opium smugglers and an increasingly corrupt administration. Will Xinjiang transcend the divide between the Han and Uyghur peoples, or will it become another hotbed of discontent tying down the resources of the Qing Dynasty?"
 xinjiang_primer_event.3.f: "" 

 tibet_primer_event.1.t: "The Roof of the World"
 tibet_primer_event.1.d: "Beneath the snow-capped peaks of the Himalayas, on the Tibetan Plateau which many call the Roof of the World, the Tibetan Empire once stood as a major power, spreading the teachings of the Buddha whilst challenging the might of the Chinese Tang Dynasty. Even after its collapse, Tibet retained significant cultural and religious influence, particularly after the Mongol Yuan Dynasty's formal recognition of the Tibetan Lamas as both spiritual and temporal authorities, establishing a precedent for the later relationship between Tibetan Buddhism and the many foreign rulers of the Tibetan Plateau."
 tibet_primer_event.1.f: ""
 tibet_primer_event.1.a: "Tell me more"
 tibet_primer_event.2.a: "Lets get started"
 
 tibet_primer_event.2.t: "The Qing Protectorate"
 tibet_primer_event.2.d: "By the 17th century, the Gelugpa school of Buddhism, with its Dalai Lama lineage had become pre-eminent in Tibet, though its authority often relied on external support. The Khoshut Mongols were the first to take up this mantle, before their fall to the Dzungars paved the way for Qing Authority in Tibet. Under the Kangxi Emperor, the Qing expelled the Dzungars from Tibet, installing a new Dalai Lama in Lhasa and bringing the Plateau under nominal Qing control. In reality, Tibet remained largely self-governing, with the Qing Amban and Chinese Garrison taking residence and ensuring that the interests of the Qing would be enforced."
 tibet_primer_event.2.f: ""
 
 tibet_primer_event.3.t: "Threats from the South"
 tibet_primer_event.3.d: "However, recent decades have presented new threats to Tibet. The Sikh Empire's annexation of Ladakh in 1834 demonstrated the weakness of the Tibetan Armies, whilst at the same time, the Qing Dynasty, Tibet's nominal suzerain is wracked by an ongoing Opium epidemic and systemic military decline. Further to the South, the British East India Company creeps ever closer to Tibet's borders, with only Nepal and Bhutan standing between us. Whilst the Qing Administration in Tibet remains intact for now, questions remain as to whether it can continue to safeguard Tibet, or if the Dalai Lama will be forced to find a new protector."
 tibet_primer_event.3.f: "" 

 taiwan_primer_event.1.t: "The Kingdom of Tungning."
 taiwan_primer_event.1.d: "Long before the Chinese set foot on its shores, Taiwan was home to indigenous tribes from the plain-dwelling Siraya to the highlander Atayal. These tribes traded with Fujianese fishermen, and clashed frequently with visiting Japanese, Korean and Ming pirates. The fall of the Ming Dynasty laid the foundation for Taiwan's incorporation into the Chinese Imperial Sphere, as Ming loyalists under Koxinga fled to the island, expelled the Dutch from Fort Zeelandia and establish the Kingdom of Tungning as a base from which to restore the Ming Dynasty. Under Koxinga, Han farmers began clearing the western plains, Confucian temples were erected and the riches of the island were put to use in trade with Japan and Southeast Asia."
 taiwan_primer_event.1.f: ""
 taiwan_primer_event.1.a: "Tell me more"
 taiwan_primer_event.2.a: "Lets get started"
 
 taiwan_primer_event.2.t: "A Ball of Mud Beyond Civilization"
 taiwan_primer_event.2.d: "Despite defeating Koxingia in 1683, the Qing regarded Taiwan as a ball of mud beyond the reach of civilization. For over a century, the island remained a military outpost, with a few key garrisons and strict limits placed on Han migration. Migration occurred nevertheless, with illegal settlers pushing beyond the borders of the Qing administration to establish their own settlements on lands nominally under the control of the aboriginal tribes. These illegal settlements were nevertheless ignored by local authorities, who turned a blind eye until the island itself erupted into rebellion in 1786."
 taiwan_primer_event.2.f: ""
 
 taiwan_primer_event.3.t: "Chinese Colonization"
 taiwan_primer_event.3.d: "After the rebellion, it was finally agreed upon by the Qianlong Emperor that failing to extend Qing control across the entire island only invited illegal settlers and subversive elements. Qing perceptions of the island soon changed to view it as an important coastal frontier with which to defend the Chinese coast. Territories in the lowland plains were continually opened up to Han settlement, though it was a gradual process as the Qing remained fearful of starting a conflict with the aboriginal tribes. However, as foreign threats continue to encroach on China's shores, many question the wisdom of such a move, and calls are being made in the Imperial Court to open up the entire island to Han colonization."
 taiwan_primer_event.3.f: "" 

 ethiopia_primer_event.1.t: "The Kingdom of Prester John" #Christianity and Axum
 ethiopia_primer_event.1.d: "Long before Europeans dreamt of a mythical Christian monarch in the East, the Kingdom of Axum, nestled between the Nile and Red Sea had emerged as a power of note. Having converted to Christianity in the 4th century, the Kingdom grew isolated with the rise of Islam, and by the Middle Ages, legends of Prester John had intertwined with the Kingdom's existence to create a hopefully ally against Islam. Axum would prove to be far more complex than this legend, and its a survival as a Christian realm surrounded by Muslim powers only strengthened its reputation."
 ethiopia_primer_event.1.f: ""
 ethiopia_primer_event.1.a: "Tell me more"
 ethiopia_primer_event.2.a: "Lets get started"
 
 ethiopia_primer_event.2.t: "The Abyssinian Empire" #Ethiopian Empire rise and decline
 ethiopia_primer_event.2.d: "When the Kingdom of Axum declined in the 9th century, the Solomonic Dynasty, claiming descent from the legendary King Solomon and Queen of Sheba would rise to fill its place. Under the Solomonids, Ethiopia expanded aggressively, crushing the encroaching Muslim emirates and forging a new Empire within the Amharic Highlands. However by the 15th century, its strength would be tested by a resurgent Adal Sultanate, with the Empire surviving only thanks to the efforts of the Portuguese, who had come to Ethiopia in hopes of receiving aid, not granting it. With the Portuguese came Jesuit missionaries, sparking in doctrinal conflicts with the Ethiopian Church that culminated in the brief conversion of Emperor Susyenos to Catholicism in 1622. His successor Emperor Fasilides would instead expel the Portuguese, found a new Imperial capital at Gondar and return the country to isolation."
 ethiopia_primer_event.2.f: ""
 
 ethiopia_primer_event.3.t: "The Age of Princes" #Zemene Mesafint overview
 ethiopia_primer_event.3.d: "By the 18th century however, the Solomonid Emperors had become puppets, with their authority barely extending outside the walls of Gondar. The Zemene Mesafint - the Age of Princes, saw Amharic and Oromo warlords wield true power, as regional nobles throughout the Empire fought for dominance. The Zemene Mesafint has continued for over half a century, and by 1836, Ethiopia's disarray invited crisis as the modernized armies of Egypt now extended their influence over the Upper Nile and began eyeing the highlands themselves. A great leader is now needed to unite the fractured empire, but the question remains as to who will rise to the occasion."
 ethiopia_primer_event.3.f: "'I know their game. First the traders and the missionaries, then the ambassadors, then the cannon. It's better to go straight to the cannon.' \n-Emperor Tewodros of Ethiopia"

 dai_nam_primer_event.1.t: "The Pacified South" #Jiaozhi, Annam and Vietnam under Chinese Rule, sinicization.
 dai_nam_primer_event.1.d: "For over a millenium, the lands of the Red River Delta were known to the Chinese as Annam; the Pacified South. Under the domination of successive Chinese dynasties, the Vietnamese elites, much like their Korean counterparts in contemporary Goryeo, would adopt many aspects of Chinese political and social traditions, bringing ideas of Confucianism, Meritocracy and Buddhism into the region that would form the base of a future independent Vietnamese dynasties."
 dai_nam_primer_event.1.f: "“I’d like to ride storms, kill sharks in the open sea, drive out the aggressors, reconquer our country, untie the binds of serfdom – and never bend my back to be the concubine of whatever man.” \n-Lady Trieu, 3rd century Vietnamese rebel leader"
 dai_nam_primer_event.1.a: "Tell me more"
 dai_nam_primer_event.2.a: "Lets get started"
 
 dai_nam_primer_event.2.t: "The Rise of the Nguyen Dynasty" #Vietnamese civil war, rise of Gia Long with French assistance, 
 dai_nam_primer_event.2.d: "Vietnam's independence was hard won, with Ngo Quyen's victory at the Bach Dang river in 938 against the Southern Han bringing about the first Vietnamese state. Under successive dynasties, the Ly, Tran and Le, Vietnam enacted a policy of 'Nam Tien' - Southwards Expansion towards the Mekong Delta, seeking to emulate similar military campaigns conducted by the Chinese in ages past. However by the late 18th century, the Le Emperors had become puppets, with Vietnam divided between the Trinh Lords in the north, and the Nguyen Lords in the south. The Tay Son Rebellion would eventually overthrow both, but the Nguyen Lords persisted, with their last member, Nguyen Anh crowned as Emperor Gia Long in 1802 with the aid of French officers and cannons."
 dai_nam_primer_event.2.f: ""
 
 dai_nam_primer_event.3.t: "A New Emperor Ascends" #Death of Gia Long, Rise of Minh Mang, wars with Siam, strained relationship with France, Le Van Khoi Rebellion
 dai_nam_primer_event.3.d: "With the death of Emperor Gia Long, his son Minh Mang inherits an empire at the crossroads. A staunch orthodox Confucian, he has centralized power and waged war against the Siamese, seizing the majority of Cambodia in 1834 and installing Princess Ang Mey as a puppet ruler. To the north, he has continued the practice of sending tribute to China, styling himself as King of Viet Nam in official correspondence to the Qing Court to maintain good relations. At home, his persecution of foreign influences, particularly Catholicism has been relentless, culminating in the Le Van Khoi rebellion against his rule that was only put down a few months prior after a two-year long siege at Gia Dinh. His actions have strained Vietnam's relationship with France, however, and as European encroachment in Southeast Asia grows, only time will tell if the Emperor's actions will invite a storm of retribution, or if the Dragon of the South shall stand strong."
 dai_nam_primer_event.3.f: "“The Christians invented the doctrines of Heaven and Hell in order to stupefy the people, to make them behave as if insane. They are so impregnated with these notions that this becomes their habitual behaviour. They become corrupted, and yet they are unaware of their corruption.” \n-Edict of Emperor Gia Long, 1804"

 siam_primer_event.1.t: "The Thai People" #City-states along the Chao Phraya Delta and migration
 siam_primer_event.1.d: "The ancestors of the Thai people emerged from the fertile valleys of southern China, gradually migrating southward between the 8th and 13th centuries under pressure from the expansion of successive Chinese dynasties. Settling in the Chao Phraya River basin, they established city-states that oscillated between independence and vassalage under regional mandalas such as the Khmer Empire to the southeast, the Mon kingdoms to the west, and the Tai Lanna realm in the north. By the 13th century, Sukhothai would emerge as the first major Thai kingdom, cementing Theravada Buddhism as the faith of the Thai people, and creating the Thai script."
 siam_primer_event.1.f: ""
 siam_primer_event.1.a: "Tell me more"
 siam_primer_event.2.a: "Lets get started"
 
 siam_primer_event.2.t: "The Rise of Rattanakosin" #Ayyuthaya, Thonburi and Rattanakosin
 siam_primer_event.2.d: "Following the decline of Sukhothai, the Ayyuthaya Kingdom would transform Siam into a regional power, dominating the region until its disastrous defeat to the Burmese in 1767. From the ashes of Ayyuthaya rose the Thonburi Kingdom, which briefly reunited the fractured Thai city-states of the Chao Phraya Delta before being overthrown in 1782. A Thonburi general; Rama I, would found the Chakri Dynasty, establishing the city of Krungthep Mahanakhon Amonrattanakosin - otherwise known as Bangkok - as his new capital at the mouth of the Chao Phraya River. King Rama would secure his legitimacy by defeating the Burmese invasions and reasserting dominance over the Laotian Principalities to the North, the Khmer to the East and the Malay Sultanates to the South."
 siam_primer_event.2.f: "Krungthep Mahanakhon Amonrattanakosin Mahintharayutthaya Mahadilokphop Noppharatratchathaniburirom Udomratchaniwetmahasathan Amonphimanawatansathit Sakkathattiyawitsanukamprasit. \n-The official name of the Siamese capital"
 
 siam_primer_event.3.t: "The Recent Decades" #Recent History (Treaties, Tribute status with China, wars with Vietnam over Laos and Cambodia)
 siam_primer_event.3.d: "By the time of King Rama III, the situation in the Rattanakosin Kingdom had changed dramatically. European encroachment from the West and South threatens the independence of the Siamese, with the Burney Treaty of 1826 seeing the Kingdom lose influence in the Malay Peninsula. In the East, the Siamese had crushed Laos in 1828, though their invasion of Cambodia in 1833 was a grave humiliation that the Siamese nobility still sought to avenge. To the North, the Qing Dynasty continues to recognize the Rattanakosin Kingdom as its tributary, though Chinese suzerainity remains nominal as internal pressures force the Manchus to look inwards. Dark clouds now loom over the Chao Phraya Delta as Chinese power diminishes and the foreigners encroach year by year with traders, missionaries and treaties. The Rattanakosin Kingdom now faces the existential question: can it survive the coming storm, or will it be swept away by the Western Wind?"
 siam_primer_event.3.f: ""

