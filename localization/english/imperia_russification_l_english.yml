l_english:
  russification_finland: "Russification of Finland"
  russification_finland_desc: "Finland has been an autonomous part of our empire for long enough. It is time to fully make them Russian, otherwise dissidence might break out."
  russification_finland_tooltip: "This is the start of russification of Finland. It will, however, come with its costs."

  russification.1.t: "Russification of Finland"
  russification.1.d: "As we are preparing the means of Russification of Finland, there is still time to back out. Doing so might save from a headache but risk a future dissidence."
  russification.1.a: "Of course we will do it. The winds of change are in the air!"
  russification.1.b: "It is too risky. We should abandon these plans, for now."