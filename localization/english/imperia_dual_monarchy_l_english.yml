l_english:
 je_imperia_hungarian_revolution: "The Hungarian Revolution"
 je_imperia_hungarian_revolution_reason: "With the Springtime of People in full swing, now is the time to launch a revolution against our overlords!"

 imperia_je_imperia_hungarian_revolution_ultimatum_button: "Prepare Ultimatum"
 imperia_je_imperia_hungarian_revolution_ultimatum_button_desc: "Prepare an ultimatum to our overlord demanding independence for Hungary.\nWe will be able to negotiate for a lesser solution, but either way war is almost assured."

 je_imperia_austrian_neo_absolutism: "Austrian Neo-Absolutism"
 je_imperia_austrian_neo_absolutism_reason: "The Austrian Empire is in a state of crisis, and the only way to save it is to return to the old ways of absolutism."

 imperia_austria_punish_extra_land_button: "Confiscate the New Territories"
 imperia_austria_punish_extra_land_button_desc: "The Hungarian Revolution has failed, and we have the opportunity to confiscate the new territories that were added to Hungary in recent times."

 imperia_austria_punish_transylvania_button: "Confiscate Transylvania"
 imperia_austria_punish_transylvania_button_desc: "The Hungarian Revolution has failed, and we have the opportunity to confiscate Transylvania from Hungary."

 imperia_austria_punish_vojvodina_button: "Confiscate Vojvodina"
 imperia_austria_punish_vojvodina_button_desc: "The Hungarian Revolution has failed, and we have the opportunity to confiscate Vojvodina from Hungary. We should first gain a border, though."

 imperia_austria_punish_croatia_button: "Confiscate Croatia"
 imperia_austria_punish_croatia_button_desc: "The Hungarian Revolution has failed, and we have the opportunity to confiscate Croatia from Hungary."

 imperia_austria_punish_slovakia_button: "Confiscate Slovakia"
 imperia_austria_punish_slovakia_button_desc: "The Hungarian Revolution has failed, and we have the opportunity to confiscate Slovakia from Hungary."

 austria_punishment_timer_done_tt: "4 months must have passed since the last time we punished Hungary"
 
 je_imperia_passive_resistance: "Passive Resistance"
 je_imperia_passive_resistance_reason: "We must resist the Austrian Empire, but we must do so in a way that does not provoke a violent response."

