l_english:
 je_imperia_hungarian_revolution: "The Hungarian Revolution"
 je_imperia_hungarian_revolution_reason: "With the Springtime of People in full swing, now is the time to launch a revolution against our overlords!"

 imperia_je_imperia_hungarian_revolution_ultimatum_button: "Prepare Ultimatum"
 imperia_je_imperia_hungarian_revolution_ultimatum_button_desc: "Prepare an ultimatum to our overlord demanding independence for Hungary.\nWe will be able to negotiate for a lesser solution, but either way war is almost assured."

 imperia_hungary.1.t: "The Hungarian Ultimatum"
 imperia_hungary.1.desc: "The leaders of our independence movement are preparing an ultimatum for our overlord.\nWe can either argue for our current borders, or willingly retreat to a smaller Hungary.\nEither way, war is almost assured."
 imperia_hungary.1.f: "The time has come for us to show that we are worthy of freedom, or to perish with honor."
 imperia_hungary.1.a: "Demand Independence for Hungary."
 imperia_hungary.1.b: "Petition for independence for a smaller Hungary."
 imperia_hungary.1.c: "Reconsider. We are not ready for war yet."

 imperia_hungary.2.t: "The Hungarian Ultimatum"
 imperia_hungary.2.desc: "The leaders of the Hungarian independence movement have prepared an ultimatum for us...\n\nThey're demanding unconditional independence for Hungary, or they will declare war on us.\n\nWe should prepare for war."
 imperia_hungary.2.desc2: "The leaders of the Hungarian independence movement have prepared an ultimatum for us...\n\nThey're demanding independence, but are willing to negotiate for a smaller Hungary.\n\nWe can either accept their demands, or prepare for war."
 imperia_hungary.2.f: "Rebel scum! We will crush them!"
 imperia_hungary.2.a: "Accept their demands."
 imperia_hungary.2.b: "Accept their demands."
 imperia_hungary.2.c: "Decline their demands and prepare for war!"

 lost_hungarian_revolution_tt: "Hungary has lost the revolution."
 hungarian_revolution: "Hungarian Revolution"