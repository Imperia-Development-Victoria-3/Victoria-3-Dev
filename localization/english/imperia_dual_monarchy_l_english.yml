 #############################################
 ### Dual Monarchy Events Localisation #######
 #############################################

 imperia_dual_monarchy.1.t: "The Hungarian Ultimatum"
 imperia_dual_monarchy.1.desc: "The leaders of our independence movement are preparing an ultimatum for our overlord.\nWe can either argue for our current borders, or willingly retreat to a smaller Hungary.\nEither way, war is almost assured."
 imperia_dual_monarchy.1.f: "The time has come for us to show that we are worthy of freedom, or to perish with honor."
 imperia_dual_monarchy.1.a: "Demand Independence for Hungary."
 imperia_dual_monarchy.1.b: "Petition for independence for a smaller Hungary."
 imperia_dual_monarchy.1.c: "Reconsider. We are not ready for war yet."

 imperia_dual_monarchy.2.t: "The Hungarian Ultimatum"
 imperia_dual_monarchy.2.desc: "The leaders of the Hungarian independence movement have prepared an ultimatum for us...\n\nThey're demanding unconditional independence for Hungary, or they will declare war on us.\n\nWe should prepare for war."
 imperia_dual_monarchy.2.desc2: "The leaders of the Hungarian independence movement have prepared an ultimatum for us...\n\nThey're demanding independence, but are willing to negotiate for a smaller Hungary.\n\nWe can either accept their demands, or prepare for war."
 imperia_dual_monarchy.2.f: "Rebel scum! We will crush them!"
 imperia_dual_monarchy.2.a: "Accept their demands."
 imperia_dual_monarchy.2.b: "Accept their demands."
 imperia_dual_monarchy.2.c: "Decline their demands and prepare for war!"

 imperia_dual_monarchy.3.t: "The Abdication of [SCOPE.sCharacter('ruler_scope').GetFullName]"
 imperia_dual_monarchy.3.desc: "Although the Hungarian Revolt failed in their objectives, radicals within Austria has forced the [SCOPE.sCharacter('heir_scope').GetPrimaryRoleTitle] to consider his future role in Austrian politics.\n\nHe has abdicated the throne, and a new ruler, [SCOPE.sCharacter('heir_scope').GetFullName], has taken his place."
 imperia_dual_monarchy.3.f: "Rather an end in horror, than horror without end."
 imperia_dual_monarchy.3.a: "The end of an era. Beginning of a new one."

 imperia_dual_monarchy.4.t: "The Hungarian Revolution"
 imperia_dual_monarchy.4.desc: "The Hungarian Revolution has started, and [SCOPE.sCountry('austria_scope').GetNameNoFlag] is in a state of Crisis.\n\nWe can of course send aid to [SCOPE.sCountry('austria_scope').GetNameNoFlag] to preserve the status quo, or we can send aid to [SCOPE.sCountry('hungary_scope').GetNameNoFlag] to help them in their struggle."
 imperia_dual_monarchy.4.f: ""
 imperia_dual_monarchy.4.a: "Send aid to Austria." # Unique
 imperia_dual_monarchy.4.b: "Send aid to Hungary." # Unique
 imperia_dual_monarchy.4.c: "Stay out of Austria." # Generic
 imperia_dual_monarchy.4.d: "Send aid to Hungary." # Generic
 imperia_dual_monarchy.4.e: "Stay out of it."

 imperia_dual_monarchy.5.t: "Hungarian Petition"
 imperia_dual_monarchy.5.desc: "After the [SCOPE.sCountry('hungary_scope').GetAdjectiveNoFormatting] Revolution was ended violently, we instituted a new regime in [SCOPE.sCountry('hungary_scope').GetNameNoFormatting].\n\nA group of lawyers representing the [SCOPE.sCountry('hungary_scope').GetAdjectiveNoFormatting] people have petitioned us to consider whether this was legitimately done.\n\nThey argue that the Pragmatic Sanction of 1723, which established the rights of [SCOPE.sCountry('hungary_scope').GetNameNoFlag] within [SCOPE.sCountry('austria_scope').GetNameNoFlag], was violated by our actions.\n\nOur lawyers advise us that the petition has merit, and that [SCOPE.sCountry('hungary_scope').GetNameNoFormatting] is in the right."
 imperia_dual_monarchy.5.f: "The Sanctio Pragmatica, without which the empire would probably have broken up after the death of Charles III, may be regarded as the second, firmer establishment of the empire. In this new and firmer establishment, the unimpaired upholding of the constitution and laws of Hungary was once more stipulated as an explicit condition. If therefore the empire was and could be established solely on this condition, it would be wrongful to discard it."
 imperia_dual_monarchy.5.a: "The court rules in favor of the Hungarian petition."
 imperia_dual_monarchy.5.b: "Intervene by royal decree, striking down the petition."

 imperia_dual_monarchy.6.t: "The Bach Regime"
 imperia_dual_monarchy.6.desc: "The Hungarian Revolution has failed, and the Austrian Empire has instituted a new regime in Hungary.\nThe new regime, led by [SCOPE.sCharacter('bach_scope').GetFullName], has been given the task of suppressing Hungarian nationalism and restoring order to the region.\nThe Hungarian people are not happy with this new regime, and are looking for ways to resist it.\n\nBach has proposed a Grand Execution of the Hungarian perpertrators of the revolution, but we can intervene to prevent this."
 imperia_dual_monarchy.6.f: "The Hungarian people must be made to understand that they are part of the Austrian Empire, and that they must obey the laws of the Empire."
 imperia_dual_monarchy.6.a: "The Hungarians have made their own bed."
 imperia_dual_monarchy.6.b: "Intervene to prevent the executions."

 imperia_dual_monarchy.7.t: "The Arad Martyrs"
 imperia_dual_monarchy.7.desc: "The Austrians just executed the leaders of the Hungarian Revolution in Arad.\nThe Hungarian people are outraged, and are looking for ways to resist the Austrian Empire!\nWe can either try to contain the situation with a public reprimand, or we can allow the people to show their anger."
 imperia_dual_monarchy.7.f: "The Austrians are brutes!"
 imperia_dual_monarchy.7.a: "Publicly reprimand the Austrians."
 imperia_dual_monarchy.7.b: "RIOT!"

 # PLACEHOLDER
 imperia_dual_monarchy.8.t: "The Loss of Lombardy"
 imperia_dual_monarchy.8.desc: "The Austrian Empire has lost Lombardy."
 imperia_dual_monarchy.8.f: "The loss of Lombardy is a great blow to the Austrian Empire."
 imperia_dual_monarchy.8.a: "Find common ground with the Hungarians."
 imperia_dual_monarchy.8.b: "Bah! Bring the Hungarians to heel!"

 # PLACEHOLDER
 imperia_dual_monarchy.8.t: "The Resignation of Bach"
 imperia_dual_monarchy.8.desc: "[SCOPE.sCharacter('bach_scope').GetFullName] has taken the blame and resigned."
 imperia_dual_monarchy.8.f: "I prefer Mozart tbh."
 imperia_dual_monarchy.8.a: "Maybe the Hungarians aren't so bad after all?"
 imperia_dual_monarchy.8.b: "Find me a Hungarian to shoot."
 bach_resigns_tt "[SCOPE.sCharacter('bach_scope').GetFullName] resigns from political life."

 imperia_dual_monarchy.10.t: "The Easter Article"
 imperia_dual_monarchy.10.desc: "A lawyer by the name of #b Ferenc Deák#! has written an article outlining the conditions of a hypothetical future Austro-Hungarian compromise, where Hungary would be granted a high degree of autonomy within the Empire.\nThe article has been well received by the Hungarians and Austrian radicals alike, and has been published in the newspaper #b Pesti Napló#!. We can either spread the article to newspapers abroad to put more pressure on the Austrian Empire, or we can use it as a national rallying cry."
 imperia_dual_monarchy.10.f: "... a desire for separation runs throughout Hungarian history, passed on from generation to generation, just as vigorously alive now as a hundred years ago."
 imperia_dual_monarchy.10.a: "Spread the article abroad."
 imperia_dual_monarchy.10.b: "Use it as a national rallying cry."

